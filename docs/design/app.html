<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketCore — how the app looks in each option</title>
<style>
 body{margin:0;background:#101012;color:#e9e9ec;font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .bar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#0b0b0d;border-bottom:1px solid #2a2a30}
 .bar h1{font-size:14px;margin:0 14px 0 0;font-weight:650}
 .bar button{font:inherit;font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid #34343c;background:#1a1a1e;color:#c9c9d2;cursor:pointer}
 .bar button[aria-pressed=true]{background:#e9e9ec;border-color:#e9e9ec;color:#111}
 .hint{color:#8a8a95;font-size:12px;max-width:1400px;margin:0 auto;padding:14px 20px 0}
 .grid{max-width:1400px;margin:0 auto;padding:16px 20px 60px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(460px,1fr))}
 .single{max-width:1400px;margin:0 auto;padding:16px 20px 60px;display:grid;gap:24px}
 .card{border:1px solid #2b2b32;border-radius:10px;overflow:hidden;background:#17171b}
 .cap{display:flex;align-items:baseline;gap:10px;padding:10px 13px;border-bottom:1px solid #2b2b32;flex-wrap:wrap}
 .cap b{font-size:13px;font-weight:650}
 .cap span{font-size:11px;color:#8a8a95}
 .cap .tag{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid #34343c;color:#9a9aa5}
 .shot{position:relative;height:344px;overflow:hidden;background:#000}
 .shot iframe{position:absolute;top:0;left:0;width:1280px;height:960px;border:0;transform:scale(.3594);transform-origin:top left}
 .single .shot{height:780px}
 .single .shot iframe{position:static;width:100%;height:100%;transform:none}
</style></head><body>
<div class="bar">
  <h1>How the app looks in each option</h1>
  <button data-screen="catalog" aria-pressed="true">Catalog</button>
  <button data-screen="signin" aria-pressed="false">Sign in</button>
  <span style="flex:1"></span>
  <button id="mode" aria-pressed="false">Larger</button>
</div>
<p class="hint" id="hint"></p>
<div id="out"></div>
<script>
const OPTIONS = [{"id":"selvedge","note":"dye and thread · status is a structural edge, not a chip","dark":false,"tokens":{"--canvas":"#f4f1e9","--surface":"#fffdf9","--sunken":"#eae5d9","--rail":"#1c2a45","--rail-edge":"#101c33","--rail-ink":"#ffffff","--rail-muted":"#8e95a2","--rail-hover":"#2c3952","--rail-active":"#3c485f","--ink":"#23201a","--ink-muted":"#6a655b","--ink-faint":"#76736d","--rule":"#d5d2ca","--rule-strong":"#b1aea7","--action":"#2f4470","--action-hover":"#506287","--action-ink":"#ffffff","--ok":"#2f6b4f","--signal":"#9c3d2e","--radius":"7px","--stack":"ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif","--thread-published":"#2f6b4f","--thread-draft":"#b8b0a0","--thread-out":"#9c3d2e","--meter-display":"flex"}},{"id":"tally","note":"counting first · no dark chrome, quantity drawn as length","dark":false,"tokens":{"--canvas":"#ffffff","--surface":"#ffffff","--sunken":"#f1f4f7","--rail":"#e6ebef","--rail-edge":"#ced4da","--rail-ink":"#1b1e24","--rail-muted":"#676b70","--rail-hover":"#d5dade","--rail-active":"#c2c7cd","--ink":"#14161a","--ink-muted":"#5c636e","--ink-faint":"#6e7277","--rule":"#dcdcdd","--rule-strong":"#b4b4b6","--action":"#24408e","--action-hover":"#475fa0","--action-ink":"#ffffff","--ok":"#0f6b3f","--signal":"#b45309","--radius":"7px","--stack":"ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif","--meter-display":"flex"}},{"id":"nightshift","note":"warm dark for a screen left open · the rail is lighter, not darker","dark":true,"tokens":{"--canvas":"#16151a","--surface":"#201f26","--sunken":"#121116","--rail":"#2a2831","--rail-edge":"#1b1a20","--rail-ink":"#ffffff","--rail-muted":"#959498","--rail-hover":"#39373f","--rail-active":"#48464e","--ink":"#efece6","--ink-muted":"#a49e94","--ink-faint":"#8b8885","--rule":"#343338","--rule-strong":"#57575a","--action":"#ffb02e","--action-hover":"#d69427","--action-ink":"#141210","--ok":"#86d3a4","--signal":"#ff8a6b","--radius":"7px","--stack":"ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif","--bevel":"rgba(255,255,255,.07)"}},{"id":"copperplate","note":"instrument panel · structure from borders, a hairline of light on top","dark":false,"tokens":{"--canvas":"#e7e5e0","--surface":"#f6f5f2","--sunken":"#ddd9d3","--rail":"#2b2a27","--rail-edge":"#1c1b19","--rail-ink":"#ffffff","--rail-muted":"#959593","--rail-hover":"#3a3936","--rail-active":"#494845","--ink":"#1d1b18","--ink-muted":"#5f5c55","--ink-faint":"#6e6c68","--rule":"#c9c7c2","--rule-strong":"#a6a4a0","--action":"#37506b","--action-hover":"#576c83","--action-ink":"#ffffff","--ok":"#2f6b4f","--signal":"#8a4b2a","--radius":"7px","--stack":"ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif","--bevel":"rgba(255,255,255,.55)"}},{"id":"shadcn","note":"shadcn/ui default theme · zinc, 8px radius, separation from borders not fills","dark":false,"tokens":{"--canvas":"#f4f4f5","--surface":"#ffffff","--sunken":"#f4f4f5","--rail":"#f4f4f5","--rail-edge":"#e4e4e7","--rail-ink":"#09090b","--rail-muted":"#6b6b74","--rail-hover":"#e6e6e7","--rail-active":"#dadadb","--ink":"#09090b","--ink-muted":"#71717a","--ink-faint":"#75757a","--rule":"#e4e4e7","--rule-strong":"#cacacd","--action":"#18181b","--action-hover":"#38383b","--action-ink":"#fafafa","--ok":"#12823b","--signal":"#ae5f05","--danger":"#d73d3d","--radius":"8px","--stack":"\"Geist\",ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif"}}];
const APP = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>MarketCore</title>\n<style>\n  *,*::before,*::after{box-sizing:border-box}\n  body{margin:0;background:var(--canvas);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}\n  .num{font-variant-numeric:tabular-nums}\n  /* ---------- shell ---------- */\n  .shell{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}\n  .rail{border-right:1px solid var(--rail-edge,var(--rule));background:var(--rail);color:var(--rail-ink);padding:16px 12px;display:flex;flex-direction:column;gap:2px}\n  .brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;padding:4px 8px 16px}\n  .dot{width:9px;height:9px;border-radius:99px;background:var(--action)}\n  .rail .tenant{padding:8px;border-radius:var(--radius);background:var(--rail-hover);margin-bottom:12px}\n  .rail .tenant b{display:block;font-size:13px}\n  .rail .tenant span{font-size:11px;color:var(--rail-muted)}\n  .rail nav{margin-top:4px}\n  .rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);color:var(--rail-muted);text-decoration:none;font-size:13px}\n  .rail a:hover{background:var(--rail-hover);color:var(--rail-ink)}\n  .rail a[aria-current] {background:var(--rail-active);color:var(--rail-ink);font-weight:600}\n  .rail a[aria-disabled]{opacity:.55}\n  .rail .phase{font-size:10px;color:var(--rail-muted)}\n  .rail .me{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--rail-hover);font-size:11px;color:var(--rail-muted)}\n  /* ---------- top bar ---------- */\n  .col{display:flex;flex-direction:column;min-width:0}\n  .top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--rule)}\n  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}\n  .pill small{color:var(--ink-faint);font-weight:500}\n  .spacer{flex:1}\n  .who{font-size:12px;color:var(--ink-muted)}\n  .btn{font:inherit;font-weight:600;border:0;border-radius:var(--radius);padding:9px 16px;cursor:pointer;background:var(--action);color:var(--action-ink)}\n  .btn.quiet{background:transparent;color:var(--ink-muted);border:1px solid var(--rule);padding:8px 14px}\n  .btn.quiet:hover{color:var(--ink);border-color:var(--rule-strong)}\n  /* ---------- counts: inline label+value, not a hero number ---------- */\n  .counts{display:flex;gap:22px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--rule);background:var(--surface);font-size:12px;color:var(--ink-muted)}\n  .counts b{color:var(--ink);font-weight:650;margin-left:6px}\n  .counts .attn b{color:var(--signal)}\n  /* ---------- work ---------- */\n  .work{padding:22px 24px 32px;display:flex;flex-direction:column;gap:14px}\n  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}\n  .sub{margin:3px 0 0;color:var(--ink-muted);font-size:12px}\n  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n  .search{position:relative;flex:1 1 260px;max-width:340px}\n  .search input{width:100%;font:inherit;padding:9px 12px 9px 30px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);color:var(--ink)}\n  .search input:focus-visible{outline:2px solid var(--action);outline-offset:1px}\n  .search span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}\n  .chip{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--rule);background:transparent;color:var(--ink-muted);cursor:pointer}\n  .chip[aria-pressed=\"true\"]{background:var(--action);border-color:var(--action);color:var(--action-ink)}\n  /* ---------- table ---------- */\n  .panel{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--surface)}\n  table{width:100%;border-collapse:collapse}\n  th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-faint);padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--sunken);white-space:nowrap}\n  td{padding:10px 14px;border-bottom:1px solid var(--rule);height:46px;vertical-align:middle}\n  tr:last-child td{border-bottom:0}\n  tbody tr:hover td{background:var(--sunken)}\n  .r{text-align:right}\n  .name{font-weight:600}\n  .slug{display:block;color:var(--ink-faint);font-size:11px;margin-top:1px}\n  .clip{display:block;max-width:36ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}\n  .status i{width:7px;height:7px;border-radius:99px;background:currentColor;font-style:normal}\n  .published{color:var(--ok)} .draft{color:var(--ink-muted)} .out{color:var(--signal)}\n  .link{font:inherit;font-size:12px;font-weight:600;background:none;border:0;color:var(--action);cursor:pointer;padding:4px 6px;border-radius:var(--radius)}\n  .link:hover{background:var(--sunken)}\n  /* ---------- sign in ---------- */\n  .signin{display:none;place-items:center;min-height:100vh;padding:40px 20px;background:var(--canvas)}\n  .sbox{width:100%;max-width:372px}\n  .sbox h1{font-size:22px;margin:0}\n  .sbox p.lead{margin:6px 0 22px;color:var(--ink-muted)}\n  .field{display:grid;gap:5px;margin-bottom:14px}\n  .field label{font-size:12px;font-weight:600;color:var(--ink-muted)}\n  .field input{font:inherit;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);color:var(--ink)}\n  .field input:focus-visible{outline:2px solid var(--action);outline-offset:1px}\n  .field.bad input{border-color:var(--signal)}\n  .msg{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--signal);margin:0 0 14px}\n  .msg b{font-weight:700}\n  .sbox .btn{width:100%;padding:11px}\n  .foot{margin-top:18px;font-size:12px;color:var(--ink-muted)}\n  .foot a{color:var(--action)}\n  body.show-signin .shell{display:none}\n  body.show-signin .signin{display:grid}\n  body.show-catalog .signin{display:none}\n  /* --- signature moves. Present in the markup for every option; each system\n     reveals the one that carries its idea, via its own tokens. --- */\n  /* a 3px thread down the left edge of every row, coloured by status */\n  tbody td:first-child{box-shadow:inset 3px 0 0 transparent}\n  tr.is-published td:first-child{box-shadow:inset 3px 0 0 var(--thread-published,transparent)}\n  tr.is-draft td:first-child{box-shadow:inset 3px 0 0 var(--thread-draft,transparent)}\n  tr.is-out td:first-child{box-shadow:inset 3px 0 0 var(--thread-out,transparent)}\n  /* quantity as length: a track showing how much is actually sellable */\n  .meter{display:var(--meter-display,none);align-items:center;gap:8px;justify-content:flex-end}\n  .meter .track{position:relative;width:56px;height:5px;border-radius:99px;background:var(--rule);overflow:hidden}\n  .meter .fill{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--ok)}\n  .meter .fill.none{background:var(--signal)}\n  .meter.is-empty .track{background:color-mix(in oklab, var(--signal) 30%, transparent)}\n  /* a hairline of light along the top edge, for a pressed-metal feel */\n  .btn{box-shadow:inset 0 1px 0 var(--bevel,transparent)}\n</style>\n</head>\n<body class=\"show-catalog\">\n\n<div class=\"shell\">\n  <aside class=\"rail\">\n    <div class=\"brand\"><span class=\"dot\"></span>MarketCore</div>\n    <div class=\"tenant\"><b>Nile Traders</b><span>Owner</span></div>\n    <nav>\n      <a href=\"#\" aria-current=\"page\">Catalog</a>\n      <a href=\"#\" aria-disabled=\"true\">Orders <span class=\"phase\">phase 4</span></a>\n      <a href=\"#\" aria-disabled=\"true\">Payouts <span class=\"phase\">phase 11</span></a>\n    </nav>\n    <div class=\"me\">owner@marketcore.test</div>\n  </aside>\n\n  <div class=\"col\">\n    <header class=\"top\">\n      <span class=\"pill\">Nile Traders <small>Owner</small></span>\n      <span class=\"spacer\"></span>\n      <span class=\"who\">owner@marketcore.test</span>\n      <button class=\"btn quiet\">Sign out</button>\n    </header>\n\n    <div class=\"counts\">\n      <span>Published<b class=\"num\">4</b></span>\n      <span>Drafts<b class=\"num\">2</b></span>\n      <span class=\"attn\">Out of stock<b class=\"num\">1</b></span>\n      <span>Units available<b class=\"num\">37</b></span>\n    </div>\n\n    <main class=\"work\">\n      <div>\n        <h1>Catalog</h1>\n        <p class=\"sub\">Six products in Nile Traders. One is published with nothing left to sell.</p>\n      </div>\n\n      <div class=\"row\">\n        <label class=\"search\"><span>&#9906;</span><input value=\"\" placeholder=\"Search products or paste a slug\" aria-label=\"Search products\"></label>\n        <button class=\"chip\" aria-pressed=\"true\">All</button>\n        <button class=\"chip\" aria-pressed=\"false\">Published</button>\n        <button class=\"chip\" aria-pressed=\"false\">Drafts</button>\n        <span class=\"spacer\"></span>\n        <button class=\"btn\">New product</button>\n      </div>\n\n      <div class=\"panel\">\n        <table>\n          <thead>\n            <tr>\n              <th>Product</th><th>Status</th><th class=\"r\">Price</th>\n              <th class=\"r\">Available</th><th class=\"r\">Reserved</th><th></th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr class=\"is-published\">\n              <td><span class=\"name clip\">Hand-knotted Egyptian cotton runner, 300 &times; 80 cm, indigo</span><span class=\"slug\">runner-indigo-300</span></td>\n              <td><span class=\"status published\"><i></i>Published</span></td>\n              <td class=\"r num\">2,450.00 EGP</td>\n              <td class=\"r\"><span class=\"meter\"><span class=\"track\"><span class=\"fill\" style=\"width:80%\"></span></span></span><span class=\"num\">12</span></td>\n              <td class=\"r num\">0</td>\n              <td class=\"r\"><button class=\"link\">Edit</button></td>\n            </tr>\n            <tr class=\"is-published\">\n              <td><span class=\"name\">Linen table runner</span><span class=\"slug\">linen-runner</span></td>\n              <td><span class=\"status published\"><i></i>Published</span></td>\n              <td class=\"r num\">1,299.00 EGP</td>\n              <td class=\"r\"><span class=\"meter\"><span class=\"track\"><span class=\"fill\" style=\"width:60%\"></span></span></span><span class=\"num\">9</span></td>\n              <td class=\"r num\">2</td>\n              <td class=\"r\"><button class=\"link\">Edit</button></td>\n            </tr>\n            <tr class=\"is-out\">\n              <td><span class=\"name\">Cotton bath towel, set of four</span><span class=\"slug\">towel-set-4</span></td>\n              <td><span class=\"status published\"><i></i>Published</span></td>\n              <td class=\"r num\">899.00 EGP</td>\n              <td class=\"r\"><span class=\"meter is-empty\"><span class=\"track\"><span class=\"fill none\" style=\"width:0%\"></span></span></span><span class=\"num out\">0</span></td>\n              <td class=\"r num\">1</td>\n              <td class=\"r\"><button class=\"link\">Restock</button></td>\n            </tr>\n            <tr class=\"is-published\">\n              <td><span class=\"name\">Hand-loomed wool throw</span><span class=\"slug\">wool-throw</span></td>\n              <td><span class=\"status published\"><i></i>Published</span></td>\n              <td class=\"r num\">3,100.00 EGP</td>\n              <td class=\"r\"><span class=\"meter\"><span class=\"track\"><span class=\"fill\" style=\"width:100%\"></span></span></span><span class=\"num\">15</span></td>\n              <td class=\"r num\">0</td>\n              <td class=\"r\"><button class=\"link\">Edit</button></td>\n            </tr>\n            <tr class=\"is-draft\">\n              <td><span class=\"name\">Jacquard tablecloth, 8 seats</span><span class=\"slug\">tablecloth-jacquard-8</span></td>\n              <td><span class=\"status draft\"><i></i>Draft</span></td>\n              <td class=\"r num\">1,750.00 EGP</td>\n              <td class=\"r\"><span class=\"meter\"><span class=\"track\"><span class=\"fill\" style=\"width:7%\"></span></span></span><span class=\"num\">1</span></td>\n              <td class=\"r num\">0</td>\n              <td class=\"r\"><button class=\"link\">Publish</button></td>\n            </tr>\n            <tr class=\"is-draft\">\n              <td><span class=\"name\">Cotton cushion cover, plain</span><span class=\"slug\">cushion-cover</span></td>\n              <td><span class=\"status draft\"><i></i>Draft</span></td>\n              <td class=\"r num\">0.00 EGP</td>\n              <td class=\"r\"><span class=\"meter is-empty\"><span class=\"track\"><span class=\"fill none\" style=\"width:0%\"></span></span></span><span class=\"num out\">0</span></td>\n              <td class=\"r num\">0</td>\n              <td class=\"r\"><button class=\"link\">Set price</button></td>\n            </tr>\n          </tbody>\n        </table>\n      </div>\n    </main>\n  </div>\n</div>\n\n<div class=\"signin\">\n  <div class=\"sbox\">\n    <div class=\"brand\" style=\"color:var(--ink)\"><span class=\"dot\"></span>MarketCore</div>\n    <h1>Sign in</h1>\n    <p class=\"lead\">Use the account you registered.</p>\n    <div class=\"field\"><label for=\"e\">Email</label><input id=\"e\" value=\"owner@marketcore.test\"></div>\n    <div class=\"field bad\"><label for=\"p\">Password</label><input id=\"p\" type=\"password\" value=\"correct-horse-battery\"></div>\n    <p class=\"msg\"><b>!</b>Invalid credentials. Check the address and password, then try again.</p>\n    <button class=\"btn\">Sign in</button>\n    <p class=\"foot\">No account? <a href=\"#\">Create one</a></p>\n  </div>\n</div>\n\n</body>\n</html>\n";
let screen = 'catalog', big = false;
function render() {
  const grid = document.createElement('div');
  grid.className = big ? 'single' : 'grid';
  for (const o of OPTIONS) {
    const vars = Object.entries(o.tokens).map(([k, v]) => k + ':' + v).join(';');
    let doc = APP.replace('</head>', '<style>:root{' + vars + '}</style></head>')
                 .replace('class="show-catalog"', 'class="show-' + screen + '"');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="cap"><b>' + o.id + '</b><span>' + o.note + '</span><span class="tag">' + (o.dark ? 'dark' : 'light') + '</span></div><div class="shot"><iframe sandbox="allow-same-origin"></iframe></div>';
    card.querySelector('iframe').srcdoc = doc;
    grid.append(card);
  }
  document.getElementById('out').replaceChildren(grid);
  document.getElementById('hint').textContent = OPTIONS.length + ' options, drawn from scratch for this product rather than borrowed from a library. Same markup, same data, same control-room structure — only the design system changes.';
}
for (const b of document.querySelectorAll('[data-screen]')) b.addEventListener('click', () => {
  screen = b.dataset.screen;
  document.querySelectorAll('[data-screen]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
document.getElementById('mode').addEventListener('click', (e) => { big = !big; e.currentTarget.setAttribute('aria-pressed', String(big)); render(); });
render();
</script></body></html>
