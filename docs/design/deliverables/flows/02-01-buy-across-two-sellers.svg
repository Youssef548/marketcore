A, then seller B</tspan></text><text x="507" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">stock unchanged — no hold</text><rect x="713" y="260" width="210" height="74" rx="8" fill="#f1eefb" stroke="#6b5bb0" stroke-width="1.4"/><rect x="713" y="260" width="5" height="74" rx="2.5" fill="#6b5bb0"/><text x="821" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="821" dy="0">Cart grouped by</tspan><tspan x="821" dy="16">seller, live</tspan><tspan x="821" dy="16">availability</tspan></text><text x="821" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">at most 10 per line</text><rect x="1027" y="260" width="210" height="74" rx="8" fill="#f1eefb" stroke="#6b5bb0" stroke-width="1.4"/><rect x="1027" y="260" width="5" height="74" rx="2.5" fill="#6b5bb0"/><text x="1135" y="289" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1135" dy="0">Review step — every</tspan><tspan x="1135" dy="16">price and stock change</tspan></text><polygon points="1446,122 1551,159 1446,196 1341,159" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.4"/><text x="1446" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1b1a18"><tspan x="1446" dy="0">Changes confirmed, one</tspan><tspan x="1446" dy="14">currency?</tspan></text><rect x="1655" y="398" width="210" height="74" rx="8" fill="#e9f3f0" stroke="#0e6b5c" stroke-width="1.4"/><rect x="1655" y="398" width="5" height="74" rx="2.5" fill="#0e6b5c"/><text x="1763" y="429" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1763" dy="0">Place order</tspan></text><text x="1763" y="444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">Idempotency-Key scoped to the buyer</text><rect x="1969" y="536" width="210" height="74" rx="8" fill="#eef3e6" stroke="#5d7a34" stroke-width="1.4"/><rect x="1969" y="536" width="5" height="74" rx="2.5" fill="#5d7a34"/><text x="2077" y="559" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="2077" dy="0">One transaction: 1</tspan><tspan x="2077" dy="16">Checkout + 2 Orders</tspan></text><text x="2077" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">one order per seller</text><rect x="2283" y="260" width="210" height="74" rx="37" fill="#f1eefb" stroke="#6b5bb0" stroke-width="1.4"/><rect x="2283" y="260" width="5" height="74" rx="2.5" fill="#6b5bb0"/><text x="2391" y="283" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="2391" dy="0">Order placed — Pending</tspan><tspan x="2391" dy="16">payment</tspan></text><text x="2391" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">payment step arrives phases 6–7</text><rect x="1655" y="674" width="210" height="74" rx="8" fill="#f7eae9" stroke="#8a4b47" stroke-width="1.4"/><rect x="1655" y="674" width="5" height="74" rx="2.5" fill="#8a4b47"/><text x="1763" y="703" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1763" dy="0">Place order stays</tspan><tspan x="1763" dy="16">disabled</tspan></text></svg>