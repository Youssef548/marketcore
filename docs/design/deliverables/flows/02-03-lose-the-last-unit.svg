ial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="821" dy="0">Row lock — the second</tspan><tspan x="821" dy="16">waits</tspan></text><polygon points="1132,398 1237,435 1132,472 1027,435" fill="#e9f3f0" stroke="#0e6b5c" stroke-width="1.4"/><text x="1132" y="439" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1b1a18"><tspan x="1132" dy="0">Unit still available?</tspan></text><rect x="1341" y="398" width="210" height="74" rx="37" fill="#e9f3f0" stroke="#0e6b5c" stroke-width="1.4"/><rect x="1341" y="398" width="5" height="74" rx="2.5" fill="#0e6b5c"/><text x="1449" y="427" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1449" dy="0">First buyer: COMMIT —</tspan><tspan x="1449" dy="16">checkout + order</tspan></text><rect x="1341" y="674" width="210" height="74" rx="8" fill="#f7eae9" stroke="#8a4b47" stroke-width="1.4"/><rect x="1341" y="674" width="5" height="74" rx="2.5" fill="#8a4b47"/><text x="1449" y="705" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1449" dy="0">Second buyer: rollback</tspan></text><text x="1449" y="720" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">0 orders · 0 stock change · not charged</text><rect x="1655" y="260" width="210" height="74" rx="37" fill="#f1eefb" stroke="#6b5bb0" stroke-width="1.4"/><rect x="1655" y="260" width="5" height="74" rx="2.5" fill="#6b5bb0"/><text x="1763" y="289" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1763" dy="0">Back to the cart —</tspan><tspan x="1763" dy="16">line flagged Sold out</tspan></text></svg>