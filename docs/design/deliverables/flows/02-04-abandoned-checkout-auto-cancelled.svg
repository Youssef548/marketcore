<svg xmlns="http://www.w3.org/2000/svg" width="1744" height="594" viewBox="0 0 1744 594"><rect width="1744" height="594" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1a18"/></marker></defs><text x="48" y="38" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a18">Abandoned checkout auto-cancelled</text><text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d6a63">INV-15 — stock restored exactly once; the worker is a plain interval process from phase 4 (D70)</text><rect x="48" y="102" width="1648" height="124" rx="6" fill="#f8efe2" opacity="0.5"/><text x="64" y="168" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a5651f" letter-spacing="0.06em">WORKER</text><rect x="48" y="240" width="1648" height="124" rx="6" fill="#eef3e6" opacity="0.5"/><text x="64" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5d7a34" letter-spacing="0.06em">DATABASE</text><rect x="48" y="378" width="1648" height="124" rx="6" fill="#f7eae9" opacity="0.5"/><text x="64" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a4b47" letter-spacing="0.06em">ALT OUTCOME</text><path d="M 295 159 H 321 V 297 H 399" fill="none" stroke="#1b1a18" stroke-width="1.4" opacity="0.72" marker-end="url(#a)"/><path d="M 609 297 H 635 V 159 H 713" fill="none" stroke="#1b1a18" stroke-width="1.4" opacity="0.72" marker-end="url(#a)"/><path d="M 923 159 H 949 V 297 H 1027" fill="none" stroke="#1b1a18" stroke-width="1.4" opacity="0.72" marker-end="url(#a)"/><rect x="972.7" y="219" width="30.6" height="18" rx="3" fill="#ffffff" stroke="#c9c3b7"/><text x="988" y="231.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">yes</text><path d="M 923 159 H 949 V 435 H 1027" fill="none" stroke="#1b1a18" stroke-width="1.4" opacity="0.72" marker-end="url(#a)"/><rect x="975.8" y="288" width="24.4" height="18" rx="3" fill="#ffffff" stroke="#c9c3b7"/><text x="988" y="300.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">no</text><path d="M 1237 297 H 1263 V 159 H 1341" fill="none" stroke="#1b1a18" stroke-width="1.4" opacity="0.72" marker-end="url(#a)"/><rect x="85" y="122" width="210" height="74" rx="37" fill="#f8efe2" stroke="#a5651f" stroke-width="1.4"/><rect x="85" y="122" width="5" height="74" rx="2.5" fill="#a5651f"/><text x="193" y="143" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="193" dy="0">Interval tick —</tspan><tspan x="193" dy="16">checkouts unpaid 30</tspan><tspan x="193" dy="16">min</tspan></text><rect x="399" y="260" width="210" height="74" rx="8" fill="#eef3e6" stroke="#5d7a34" stroke-width="1.4"/><rect x="399" y="260" width="5" height="74" rx="2.5" fill="#5d7a34"/><text x="507" y="283" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="507" dy="0">UPDATE checkout →</tspan><tspan x="507" dy="16">Cancelled</tspan></text><text x="507" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">WHERE status = Pending payment</text><polygon points="818,122 923,159 818,196 713,159" fill="#f8efe2" stroke="#a5651f" stroke-width="1.4"/><text x="818" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1b1a18"><tspan x="818" dy="0">Row count = 1?</tspan></text><rect x="1027" y="260" width="210" height="74" rx="8" fill="#eef3e6" stroke="#5d7a34" stroke-width="1.4"/><rect x="1027" y="260" width="5" height="74" rx="2.5" fill="#5d7a34"/><text x="1135" y="283" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1135" dy="0">Orders → Cancelled,</tspan><tspan x="1135" dy="16">restore stock</tspan></text><text x="1135" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">same transaction</text><rect x="1341" y="122" width="210" height="74" rx="37" fill="#f8efe2" stroke="#a5651f" stroke-width="1.4"/><rect x="1341" y="122" width="5" height="74" rx="2.5" fill="#a5651f"/><text x="1449" y="151" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1449" dy="0">Stock restored exactly</tspan><tspan x="1449" dy="16">once</tspan></text><rect x="1027" y="398" width="210" height="74" rx="8" fill="#f7eae9" stroke="#8a4b47" stroke-width="1.4"/><rect x="1027" y="398" width="5" height="74" rx="2.5" fill="#8a4b47"/><text x="1135" y="421" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1135" dy="0">Another run won — no</tspan><tspan x="1135" dy="16">restock</tspan></text><text x="1135" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6a63">no Redis, no queue needed</text></svg>