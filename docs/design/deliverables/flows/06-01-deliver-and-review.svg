ke="#2f6fb0" stroke-width="1.4"/><rect x="713" y="122" width="5" height="74" rx="2.5" fill="#2f6fb0"/><text x="821" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="821" dy="0">Write a review</tspan></text><polygon points="1132,398 1237,435 1132,472 1027,435" fill="#e9f3f0" stroke="#0e6b5c" stroke-width="1.4"/><text x="1132" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1b1a18"><tspan x="1132" dy="0">Completed order with</tspan><tspan x="1132" dy="14">it, no review yet?</tspan></text><rect x="1341" y="536" width="210" height="74" rx="8" fill="#eef3e6" stroke="#5d7a34" stroke-width="1.4"/><rect x="1341" y="536" width="5" height="74" rx="2.5" fill="#5d7a34"/><text x="1449" y="565" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1449" dy="0">Review stored — unique</tspan><tspan x="1449" dy="16">(product, buyer)</tspan></text><rect x="1655" y="260" width="210" height="74" rx="37" fill="#f7f2e4" stroke="#9a7b2e" stroke-width="1.4"/><rect x="1655" y="260" width="5" height="74" rx="2.5" fill="#9a7b2e"/><text x="1763" y="289" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1763" dy="0">Seller may reply,</tspan><tspan x="1763" dy="16">never delete</tspan></text><rect x="1341" y="674" width="210" height="74" rx="8" fill="#f7eae9" stroke="#8a4b47" stroke-width="1.4"/><rect x="1341" y="674" width="5" height="74" rx="2.5" fill="#8a4b47"/><text x="1449" y="703" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a18"><tspan x="1449" dy="0">Refused — not a</tspan><tspan x="1449" dy="16">verified buyer</tspan></text></svg>