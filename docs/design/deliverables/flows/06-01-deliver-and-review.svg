<svg xmlns="http://www.w3.org/2000/svg" width="2058" height="870" viewBox="0 0 2058 870"><rect width="2058" height="870" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1a18"/></marker></defs><text x="48" y="38" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a18">Deliver and review</text><text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d6a63">Release 2 — one review per buyer per product, only after a Completed order (D65)</text><rect x="48" y="102" width="1962" height="124" rx="6" fill="#eef4fb" opacity="0.5"/><text x="64" y="168" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f6fb0" letter-spacing="0.06em">BUYER</text><rect x="48" y="240" width="1962" height="124" rx="6" fill="#f7f2e4" opacity="0.5"/><text x="64" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9a7b2e" letter-spacing="0.06em">SELLER</text><rect x="48" y="378" width="1962" height="124" rx="6" fill="#e9f3f0" opacity="0.5"/><text x="64" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0e6b5c" letter-spacing="0.06em">API</text><rect x="48" y="516" width="1962" height="124" rx="6" fill="#eef3e6" opacity="0.5"/><text x="64" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5d7a34" letter-spacing="0.06em">DATABASE</text><rect x="48" y="654" width="1962" height="124" rx="6" fill="#f7eae9" opacity="0.5"/><text x="64" y="720" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a4b47" letter-spacing="0.06em">ALT OUTCOME</text><path d="M 295 159 H 321 V 297 H 399" fill="none" stroke="#1b1a18" stroke-width="1.4" opacity="0.72" marker-end="url(#a)"/><path d="M 609 297 H 635 V 159 H 713" fill="none" stroke="#1b1a18" strok