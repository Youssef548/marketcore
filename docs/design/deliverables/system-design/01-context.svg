text x="836" y="543.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#9c3d2e" text-anchor="middle" letter-spacing="0.04em">INV-15 restock once</text><text x="440" y="575" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">The product is technical evidence: each invariant is proven by a runnable command.</text></svg>