<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660"><rect width="1180" height="660" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">MarketCore — system context</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">Who uses it and what it depends on (C4 level 1)</text><rect x="430" y="150" width="420" height="190" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.8"/><text x="640" y="186" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c2a45" text-anchor="middle">MarketCore</text><text x="640" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="middle">multi-seller marketplace — operator console + buyer storefront</text><text x="640" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="middle">Storefront · one cart across sellers</text><text x="640" y="263" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="middle">All-or-nothing checkout · one order per seller</text><text x="640" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="middle">One charge, split by the double-entry ledger</text><text x="640" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f4470" text-anchor="middle">INV-1…INV-15 — consistency under</text><text x="640" y="335" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f4470" text-anchor="middle">retries, duplicates, races and crashes</text><rect x="60" y="120" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Buyer</text><text x="76" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">no membership · cart · refund ask</text><rect x="60" y="220" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Seller / Member</text><text x="76" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">products · orders · ledger</text><rect x="60" y="320" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Organization Owner</text><text x="76" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">members · roles · audit</text><rect x="60" y="420" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Operations User</text><text x="76" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">trace · recover failed work</text><rect x="910" y="220" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="926" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Developer Reviewer</text><text x="926" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">run · test · inspect</text><rect x="910" y="420" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="926" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Provider (Stripe)</text><text x="926" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">payment · refund · payout</text><path d="M 270 157 L 430 200" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a2)" opacity="0.8"/><path d="M 270 257 L 430 240" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a2)" opacity="0.8"/><path d="M 270 357 L 430 275" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a2)" opacity="0.8"/><path d="M 270 457 L 430 310" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a2)" opacity="0.8"/><path d="M 910 257 L 850 240" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a2)" opacity="0.8"/><path d="M 850 300 L 910 440" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a3)" opacity="0.8"/><text x="870" y="380" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">interface</text><text x="870" y="394" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">port</text><rect x="440" y="470" width="105.60000000000001" height="19" rx="3" fill="#9c3d2e" opacity="0.14"/><rect x="440" y="470" width="105.60000000000001" height="19" rx="3" fill="none" stroke="#9c3d2e" stroke-width="1" opacity="0.5"/><text x="492.8" y="483.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#9c3d2e" text-anchor="middle" letter-spacing="0.04em">INV-1 oversell</text><rect x="555.6" y="470" width="124.80000000000001" height="19" rx="3" fill="#9c3d2e" opacity="0.14"/><rect x="555.6" y="470" width="124.80000000000001" height="19" rx="3" fill="none" stroke="#9c3d2e" stroke-width="1" opacity="0.5"/><text x="618" y="483.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#9c3d2e" text-anchor="middle" letter-spacing="0.04em">INV-2 idempotency</text><rect x="690.4000000000001" y="470" width="105.60000000000001" height="19" rx="3" fill="#9c3d2e" opacity="0.14"/><rect x="690.4000000000001" y="470" width="105.60000000000001" height="19" rx="3" fill="none" stroke="#9c3d2e" stroke-width="1" opacity="0.5"/><text x="743.2" y="483.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#9c3d2e" text-anchor="middle" letter-spacing="0.04em">INV-4 webhooks</text><rect x="806.0000000000001" y="470" width="92.80000000000001" height="19" rx="3" fill="#9c3d2e" opacity="0.14"/><rect x="806.0000000000001" y="470" width="92.80000000000001" height="19" rx="3" fill="none" stroke="#9c3d2e" stroke-width="1" opacity="0.5"/><text x="852.4000000000001" y="483.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#9c3d2e" text-anchor="middle" letter-spacing="0.04em">INV-6 ledger</text><rect x="440" y="500" width="99.2" height="19" rx="3" fill="#9c3d2e" opacity="0.14"/><rect x="440" y="500" width="99.2" height="19" rx="3" fill="none" stroke="#9c3d2e" stroke-width="1" opacity=