ont-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f4470" text-anchor="middle">INV-1…INV-10 — consistency under</text><text x="640" y="335" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f4470" text-anchor="middle">retries, duplicates and crashes</text><rect x="60" y="120" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Buyer</text><text x="76" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">browse · checkout · refund</text><rect x="60" y="220" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Seller / Member</text><text x="76" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">products · orders · ledger</text><rect x="60" y="320" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Organization Owner</text><text x="76" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">members · roles · audit</text><rect x="60" y="420" width="210" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca" stroke-width="1.3"/><text x="76" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#23201a" text-anchor="start">Operations User</text><text x="76" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">trace · recover failed work</