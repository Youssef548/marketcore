<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820"><rect width="1240" height="820" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">MarketCore — containers</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">Modular monolith + separately runnable worker, one database (C4 level 2)</text><rect x="70" y="110" width="260" height="108" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="70" y="110" width="260" height="30" rx="8" fill="#2f4470"/><path d="M 70 140 h 260" stroke="#1c2a45" stroke-width="1.3"/><text x="84" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">Browser</text><text x="84" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">React 19 · Next.js 15 client</text><text x="84" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">storefront + operator UI — never</text><text x="84" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">holds a credential a script can read</text><rect x="470" y="110" width="300" height="108" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="470" y="110" width="300" height="30" rx="8" fill="#2f4470"/><path d="M 470 140 h 300" stroke="#1c2a45" stroke-width="1.3"/><text x="484" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">Web — BFF</text><text x="484" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Next.js route handlers</text><text x="484" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">buyer storefront at / · operator at /admin;</text><text x="484" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">only API caller; httpOnly cookie tokens</text><rect x="470" y="300" width="300" height="150" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="470" y="300" width="300" height="30" rx="8" fill="#2f4470"/><path d="M 470 330 h 300" stroke="#1c2a45" stroke-width="1.3"/><text x="484" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">API — modular monolith</text><text x="484" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">NestJS · REST /api/v1</text><text x="484" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Auth · Organizations · Catalog ·</text><text x="484" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Inventory · Storefront · Cart ·</text><text x="484" y="402" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Orders + Checkout · Payments ·</text><text x="484" y="417" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Ledger · Refunds · Payouts · Outbox ·</text><text x="484" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Audit · Observability</text><rect x="70" y="300" width="260" height="150" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="70" y="300" width="260" height="30" rx="8" fill="#2f4470"/><path d="M 70 330 h 260" stroke="#1c2a45" stroke-width="1.3"/><text x="84" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">Worker</text><text x="84" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">interval process · phase 4</text><text x="84" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">cancels checkouts unpaid 30 min;</text><text x="84" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">BullMQ + outbox claims, phase 10;</text><text x="84" y="402" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">idempotent under at-least-once</text><rect x="470" y="560" width="300" height="96" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="470" y="560" width="300" height="30" rx="8" fill="#2f4470"/><path d="M 470 590 h 300" stroke="#1c2a45" stroke-width="1.3"/><text x="484" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">PostgreSQL 16</text><text x="484" y="612" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">source of truth</text><text x="484" y="632" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">carts · checkouts · orders · inventory ·</text><text x="484" y="647" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">payments · ledger · outbox</text><rect x="880" y="560" width="290" height="96" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="880" y="560" width="290" height="30" rx="8" fill="#2f4470"/><path d="M 880 590 h 290" stroke="#1c2a45" stroke-width="1.3"/><text x="894" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">Redis</text><text x="894" y="612" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">execution dependency · phase 10</text><text x="894" y="632" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">jobs + cache only — never the</text><text x="894" y="647" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">source of truth for money</text><rect x="880" y="300" width="290" height="108" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="880" y="300" width="290" height="30" rx="8" fill="#2f4470"/><path d="M 880 330 h 290" stroke="#1c2a45" stroke-width="1.3"/><text x="894" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">Payment provider</text><text x="894" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">Stripe (test mode)</text><text x="894" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">behind a PaymentProvider port;</text><text x="894" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">deterministic simulator swaps in</text><path d="M 330 150 L 470 150" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><text x="400" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">HTTPS</text><path d="M 540 218 L 540 300" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a2)" opacity="0.8"/><text x="596" y="262" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">BFF → API, server-to-server</text><path d="M 250 450 H 360 V 604 H 470" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><text x="300" y="520" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">cancel · outbox</text><text x="300" y="536" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">SQL</text><path d="M 540 450 L 540 560" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><text x="596" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">SQL / transactions</text><path d="M 880 610 L 770 610" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><text x="825" y="602" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">jobs / cache</text><path d="M 770 356 L 880 356" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#a3)" opacity="0.8"/><text x="825" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">capture / refund</text><path d="M 880 396 L 770 396" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)" opacity="0.8"/><text x="825" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="middle">webhooks</text><rect x="70" y="700" width="1100" height="74" rx="8" fill="#fffdf9" stroke="#d5d2ca"/><text x="90" y="726" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c2a45" text-anchor="start">The boundary that forces packages/runtime</text><text x="90" y="748" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59554c" text-anchor="start">The worker cannot import apps/api, so shared plumbing (env, Prisma module, request ids, JSON logger) lives in packages/runtime — and the rule is a build error, not a convention.</text></svg>