</text><text x="520" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#59554c" text-anchor="end">phase 1,12</text><text x="90" y="396" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2f6b4f" text-anchor="start">shipped</text><rect x="140" y="388" width="12" height="10" rx="2" fill="#e6f4ea" stroke="#2f6b4f"/><text x="160" y="396" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">planned — nothing is scaffolded ahead of its phase</text><text x="90" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#23201a" text-anchor="start"></text><rect x="70" y="440" width="300" height="130" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="70" y="440" width="300" height="30" rx="8" fill="#2f4470"/><path d="M 70 470 h 300" stroke="#1c2a45" stroke-width="1.3"/><text x="84" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">apps/web</text><text x="90" y="492" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">BFF + operator UI</text><text x="90" y="509" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">(auth) credential pages</text><text x="90" y="526" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">(dash) session-gated</text><rect x="410" y="440" width="300" height="130" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="410" y="440" width="300" height="30" rx="8" fill="#2f4470"/><path d="M 410 470 h 300" stroke="#1c2a45" stroke-width="1.3"/><text x="424" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">apps/worker</text><text x="430" y="492" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">BullMQ processors</text><text x="430" y="509" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">outbox claim + retry</text><text x="430" y="526" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">arrives phase 10</text><rect x="750" y="110" width="420" height="460" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="750" y="110" width="420" height="30" rx="8" fill="#2f4470"/><path d="M 750 140 h 420" stroke="#1c2a45" stroke-width="1.3"/><text x="764" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">packages/*</text><text x="770" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">runtime</text><text x="770" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">env · Prisma module · request ids · logger</text><text x="770" y="203" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">domain</text><text x="770" y="219" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">pure rules: TenantContext, state machines, money</text><text x="770" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">contracts</text><text x="770" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">zod schemas — the wire format, source of truth</text><text x="770" y="293" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">database</text><text x="770" y="309" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">Prisma wiring; prisma/schema one file per model</text><text x="770" y="338" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">api-client</text><text x="770" y="354" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">typed client the web app and tests share</text><text x="770" y="383" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">ui</text><text x="770" y="399" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">selvedge design system — tokens + components</text><text x="770" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#59554c" text-anchor="start">payments</text><text x="770" y="444" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">PaymentProvider port + simulator + Stripe (phase 6)</text><text x="770" y="473" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">config</text><text x="770" y="489" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">shared tsconfig / tooling presets</text><text x="770" y="518" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#23201a" text-anchor="start">eslint-config</text><text x="770" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">the boundary rules, encoded and enforced</text><rect x="70" y="610" width="1100" height="120" rx="8" fill="#fffdf9" stroke="#d5d2ca"/><text x="92" y="640" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9c3d2e" text-anchor="start">Two rules, enforced by the build</text><text x="92" y="666" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">①  an app may never import another app          ②  a package may never import an app</text><text x="92" y="684" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59554c" text-anchor="start">Both fail ESLint with boundaries/element-types, so the rule is a build error rather than a convention.</text><text x="92" y="712" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#696660" text-anchor="start">Known gap: a package→app import whose path does not resolve passes lint and tsc — recorded in the README limitations.</text><rect x="70" y="750" width="1100" height="120" rx="8" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><rect x="70" y="750" width="1100" height="30" rx="8" fill="#2f4470"/><path d="M 70 780 h 1100" stroke="#1c2a45" stroke-width="1.3"/><text x="84" y="770" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c2a45" text-anchor="start">A request, end to end</text><rect x="92" y="798" width="140" height="46" rx="7" fill="#f4f1e9" stroke="#d5d2ca"/><text x="162" y="818" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#23201a" text-anchor="middle">Browser</text><text x="162" y="834" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">UI</text><path d="M 232 821 L 246 821" fill="none" stroke="#23201a" stroke-width="1.2" marker-end="url(#ar)" opacity="0.8"/><rect x="246" y="798" width="140" height="46" rx="7" fill="#f4f1e9" stroke="#d5d2ca"/><text x="316" y="818" font-family="Helvetica, Arial, sans-serif" fon