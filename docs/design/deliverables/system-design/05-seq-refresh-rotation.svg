<svg xmlns="http://www.w3.org/2000/svg" width="880" height="914" viewBox="0 0 880 914"><rect width="880" height="914" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — refresh rotation and reuse detection</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">What keeps a session alive, and what kills it (ADR 011, web session)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Browser</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">single tab</text><path d="M 140 162 V 884" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Web BFF</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">route handler</text><path d="M 340 162 V 884" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">API</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">AuthService</text><path d="M 540 162 V 884" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="660" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="740" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="740" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">Session / RefreshToken</text><path d="M 740 162 V 884" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 340 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="130.4" y="174" width="219.2" height="15" fill="#ffffff"/><text x="240" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">GET /api/session (access token stale)</text><path d="M 340 234 L 540 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="336" y="218" width="208" height="15" fill="#ffffff"/><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">POST /auth/refresh · refresh cookie</text><path d="M 340 270 h 106 v 26 h -106" fill="none" stroke="#2f4470" stroke-width="1.3" marker-end="url(#a2)"/><rect x="454" y="276" width="285" height="15" fill="#ffffff"/><text x="458" y="288" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2f4470" text-anchor="start">single-flight: one rotation for N concurrent calls</text><path d="M 540 322 L 740 322" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="569.6" y="306" width="140.79999999999998" height="15" fill="#ffffff"/><text x="640" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">loadByTokenHash(sha256)</text><path d="M 540 358 h 106 v 26 h -106" fill="none" stroke="#23201a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="654" y="364" width="197" height="15" fill="#ffffff"/><text x="658" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59554c" text-anchor="start">decideRefreshTokenUse(record, now)</text><path d="M 740 410 L 540 410" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="617.2" y="394" width="45.599999999999994" height="15" fill="#ffffff"/><text x="640" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">record</text><path d="M 540 454 L 740 454" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="519.2" y="438" width="241.6" height="15" fill="#ffffff"/><text x="640" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">claimAndRotate — usedAt IS NULL predicate</text><path d="M 740 498 L 540 498" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="541.6" y="482" width="196.79999999999998" height="15" fill="#ffffff"/><text x="640" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">rotated = true (exactly one wins)</text><path d="M 540 542 L 340 542" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="378" y="526" width="124" height="15" fill="#ffffff"/><text x="440" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">new access + refresh</text><path d="M 340 586 L 140 586" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="161.2" y="570" width="157.6" height="15" fill="#ffffff"/><text x="240" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">200 · replace both cookies</text><path d="M 140 630 L 340 630" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="144.4" y="614" width="191.2" height="15" fill="#ffffff"/><text x="240" y="622" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">REPLAY: same refresh token again</text><path d="M 340 674 L 540 674" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="383.6" y="658" width="112.8" height="15" fill="#ffffff"/><text x="440" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">POST /auth/refresh</text><path d="M 540 718 L 740 718" fill="none" stroke="#9c3d2e" stroke-width="1.4" marker-end="url(#a3)" opacity="0.8"/><rect x="527.6" y="702" width="224.79999999999998" height="15" fill="#ffffff"/><text x="640" y="710" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">revoke session — reason REUSE_DETECTED</text><path d="M 540 762 L 140 762" fill="none" stroke="#9c3d2e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="255.60000000000002" y="746" width="168.79999999999998" height="15" fill="#ffffff"/><text x="340" y="754" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">401 — the whole session dies</text><rect x="60" y="798" width="760" height="62" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="818" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: six concurrent session loads produce exactly one /auth/refresh. A replayed token revokes the family, not just</text><text x="75" y="835" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">the request. Proven by pnpm --filter web test and the behavioural suite.</text></svg>