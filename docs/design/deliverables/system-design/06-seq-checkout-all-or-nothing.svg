<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 900 870"><rect width="900" height="870" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — multi-seller checkout, all or nothing</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">INV-1 never negative · INV-11 every seller’s order or none · 100 buyers race the last unit (phase 4)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Buyers ×100</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">each from their own cart</text><path d="M 140 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">API</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">checkout use case</text><path d="M 340 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">PostgreSQL 16</text><path d="M 540 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 340 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="7.200000000000017" y="174" width="465.59999999999997" height="15" fill="#ffffff"/><text x="240" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">POST /checkout · Idempotency-Key (buyer-scoped) · cart: seller A + seller B lines</text><path d="M 340 234 L 540 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="420" y="218" width="40" height="15" fill="#ffffff"/><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">BEGIN</text><path d="M 340 278 L 540 278" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="221.20000000000002" y="262" width="437.59999999999997" height="15" fill="#ffffff"/><text x="440" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#23201a" text-anchor="middle">SELECT inventory … WHERE product_id IN (cart) ORDER BY product_id FOR UPDATE</text><path d="M 540 322 L 340 322" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="232.4" y="306" width="415.2" height="15" fill="#ffffff"/><text x="440" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">every row locked, in one fixed order — overlapping carts cannot deadlock</text><path d="M 340 358 h 106 v 26 h -106" fill="none" stroke="#2f4470" stroke-width="1.3" marker-end="url(#a2)"/><rect x="454" y="364" width="422.5" height="15" fill="#ffffff"/><text x="458" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2f4470" text-anchor="start">every line: available ≥ quantity ?  one short line fails the whole checkout</text><path d="M 340 410 L 540 410" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="229.60000000000002" y="394" width="420.79999999999995" height="15" fill="#ffffff"/><text x="440" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">UPDATE inventory SET available = available - qty, version + 1 (each line)</text><path d="M 340 454 L 540 454" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="232.4" y="438" width="415.2" height="15" fill="#ffffff"/><text x="440" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT Checkout + one Order per seller + OrderItems (prices snapshotted)</text><path d="M 340 498 L 540 498" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="330.4" y="482" width="219.2" height="15" fill="#ffffff"/><text x="440" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT OutboxEvent (same transaction)</text><path d="M 340 542 L 540 542" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="417.2" y="526" width="45.599999999999994" height="15" fill="#ffffff"/><text x="440" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">COMMIT</text><path d="M 540 586 L 340 586" fill="none" stroke="#2f6b4f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="299.6" y="570" width="280.79999999999995" height="15" fill="#ffffff"/><text x="440" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2f6b4f" text-anchor="middle">1 commit — 1 checkout, 2 orders, Pending payment</text><path d="M 340 630 L 140 630" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="127.60000000000001" y="614" width="224.79999999999998" height="15" fill="#ffffff"/><text x="240" y="622" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">exactly 1 × 201 Created · order placed</text><path d="M 340 674 L 140 674" fill="none" stroke="#9c3d2e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="71.60000000000002" y="658" width="336.79999999999995" height="15" fill="#ffffff"/><text x="240" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">99 × 409 · rollback: 0 orders, 0 stock change, not charged</text><path d="M 140 710 h 106 v 26 h -106" fill="none" stroke="#9c3d2e" stroke-width="1.3" marker-end="url(#a3)"/><rect x="254" y="716" width="285" height="15" fill="#ffffff"/><text x="258" y="728" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9c3d2e" text-anchor="start">losers land on the cart, the line flagged Sold out</text><rect x="60" y="754" width="780" height="62" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="774" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: 100 buyers for the last unit leave one checkout, stock 0 — never negative — and 99 Sold out carts. A 3-seller cart</text><text x="75" y="791" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">with one short line leaves 0 orders and every stock unchanged. Gate: pnpm --filter api test:concurrency.</text></svg>