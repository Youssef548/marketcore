<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826"><rect width="680" height="826" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — checkout, 100 buyers for 1 unit</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">INV-1: inventory never goes negative (phase 4, in progress)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Buyers ×100</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">concurrent</text><path d="M 140 162 V 796" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">API</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">checkout use case</text><path d="M 340 162 V 796" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">PostgreSQL 16</text><path d="M 540 162 V 796" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 340 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="99.60000000000002" y="174" width="280.79999999999995" height="15" fill="#ffffff"/><text x="240" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">POST /checkout  { productId, quantity: 1 }  ×100</text><path d="M 340 234 L 540 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="420" y="218" width="40" height="15" fill="#ffffff"/><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">BEGIN</text><path d="M 340 278 L 540 278" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="347.2" y="262" width="185.6" height="15" fill="#ffffff"/><text x="440" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#23201a" text-anchor="middle">SELECT … FOR UPDATE  (row lock)</text><path d="M 540 322 L 340 322" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="350" y="306" width="180" height="15" fill="#ffffff"/><text x="440" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">row locked — the other 99 wait</text><path d="M NaN 358 h 106 v 26 h -106" fill="none" stroke="#2f4470" stroke-width="1.3" marker-end="url(#a2)"/><rect x="NaN" y="364" width="384" height="15" fill="#ffffff"/><text x="NaN" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2f4470" text-anchor="start">available ≥ requested ?  (READ COMMITTED needs the lock, not the tx)</text><path d="M 340 410 L 540 410" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="319.2" y="394" width="241.6" height="15" fill="#ffffff"/><text x="440" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT Order + OrderItems (price snapped)</text><path d="M 340 454 L 540 454" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="240.8" y="438" width="398.4" height="15" fill="#ffffff"/><text x="440" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">UPDATE inventory SET available = available - 1, version = version + 1</text><path d="M 340 498 L 540 498" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="330.4" y="482" width="219.2" height="15" fill="#ffffff"/><text x="440" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT OutboxEvent (same transaction)</text><path d="M 340 542 L 540 542" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="417.2" y="526" width="45.599999999999994" height="15" fill="#ffffff"/><text x="440" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">COMMIT</text><path d="M 540 586 L 340 586" fill="none" stroke="#2f6b4f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="411.6" y="570" width="56.8" height="15" fill="#ffffff"/><text x="440" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2f6b4f" text-anchor="middle">1 commit</text><path d="M 340 630 L 140 630" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="169.60000000000002" y="614" width="140.79999999999998" height="15" fill="#ffffff"/><text x="240" y="622" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">exactly 1 × 201 Created</text><path d="M 340 674 L 140 674" fill="none" stroke="#9c3d2e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="144.4" y="658" width="191.2" height="15" fill="#ffffff"/><text x="240" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">99 × 409 out of stock (rollback)</text><rect x="60" y="710" width="560" height="62" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="730" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: after the run, exactly one order exists and stock is 0 — never negative.</text><text x="75" y="747" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Gate: pnpm --filter api test:concurrency.</text></svg>