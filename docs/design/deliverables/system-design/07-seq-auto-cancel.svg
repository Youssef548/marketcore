<svg xmlns="http://www.w3.org/2000/svg" width="680" height="667" viewBox="0 0 680 667"><rect width="680" height="667" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — abandoned checkout auto-cancelled</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">INV-15: an abandoned checkout restores its stock exactly once (phase 4 worker, D70)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Worker run A</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">interval process</text><path d="M 140 162 V 637" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Worker run B</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">overlapping run</text><path d="M 340 162 V 637" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">Checkout / Order / Inventory</text><path d="M 540 162 V 637" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 540 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="168.8" y="174" width="342.4" height="15" fill="#ffffff"/><text x="340" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">find checkouts Pending payment with placedAt &lt; now − 30 min</text><path d="M 140 234 L 540 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="87.60000000000002" y="218" width="504.79999999999995" height="15" fill="#ffffff"/><text x="340" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#23201a" text-anchor="middle">BEGIN · UPDATE checkout SET status = Cancelled WHERE id = C AND status = Pending payment</text><path d="M 340 278 L 540 278" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="263.20000000000005" y="262" width="353.59999999999997" height="15" fill="#ffffff"/><text x="440" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">same conditional UPDATE for C (concurrent) — waits on the row</text><path d="M 540 322 L 140 322" fill="none" stroke="#2f6b4f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="216.4" y="306" width="247.2" height="15" fill="#ffffff"/><text x="340" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2f6b4f" text-anchor="middle">count = 1 — this run owns the cancellation</text><path d="M 140 366 L 540 366" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="154.8" y="350" width="370.4" height="15" fill="#ffffff"/><text x="340" y="358" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">orders of C → Cancelled · inventory available += qty (each line)</text><path d="M 140 410 L 540 410" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="317.2" y="394" width="45.599999999999994" height="15" fill="#ffffff"/><text x="340" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">COMMIT</text><path d="M 540 454 L 340 454" fill="none" stroke="#9c3d2e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="313.6" y="438" width="252.79999999999998" height="15" fill="#ffffff"/><text x="440" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">status re-checked after the lock: count = 0</text><path d="M 340 490 h 106 v 26 h -106" fill="none" stroke="#9c3d2e" stroke-width="1.3" marker-end="url(#a3)"/><rect x="454" y="496" width="186" height="15" fill="#ffffff"/><text x="458" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9c3d2e" text-anchor="start">stop — no restock, nothing to do</text><rect x="60" y="534" width="560" height="79" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="554" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: two concurrent cancellation runs over one expired checkout restore each</text><text x="75" y="571" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">product’s stock once. The status predicate, not a lock service or a queue, is the guard —</text><text x="75" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">so the phase-4 worker needs no Redis.</text></svg>