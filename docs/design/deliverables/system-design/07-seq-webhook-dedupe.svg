<svg xmlns="http://www.w3.org/2000/svg" width="880" height="870" viewBox="0 0 880 870"><rect width="880" height="870" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — a payment webhook, delivered twice</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">INV-4: each business side effect at most once (phases 6–8)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Provider</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">Stripe</text><path d="M 140 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">API</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">webhook controller</text><path d="M 340 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">PostgreSQL</text><path d="M 540 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="660" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="740" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Worker</text><text x="740" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">phase 10</text><path d="M 740 162 V 840" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 340 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="74.4" y="174" width="331.2" height="15" fill="#ffffff"/><text x="240" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">POST /webhooks  payment_intent.succeeded  (eventId evt_1)</text><path d="M 340 234 L 540 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="294" y="218" width="292" height="15" fill="#ffffff"/><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT WebhookEvent (provider, eventId) — unique ⧗</text><path d="M 540 278 L 340 278" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="411.6" y="262" width="56.8" height="15" fill="#ffffff"/><text x="440" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">inserted</text><path d="M 340 322 L 540 322" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="358.4" y="306" width="163.2" height="15" fill="#ffffff"/><text x="440" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">payment Pending → Succeeded</text><path d="M 340 366 L 540 366" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="310.8" y="350" width="258.4" height="15" fill="#ffffff"/><text x="440" y="358" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT LedgerTransaction + entries (sum = 0)</text><path d="M 340 410 L 540 410" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="330.4" y="394" width="219.2" height="15" fill="#ffffff"/><text x="440" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT OutboxEvent (same transaction)</text><path d="M 340 454 L 140 454" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="217.2" y="438" width="45.599999999999994" height="15" fill="#ffffff"/><text x="240" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">200 OK</text><path d="M 140 498 L 340 498" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="124.80000000000001" y="482" width="230.39999999999998" height="15" fill="#ffffff"/><text x="240" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">RETRY: same event evt_1 delivered again</text><path d="M 340 542 L 540 542" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="327.6" y="526" width="224.79999999999998" height="15" fill="#ffffff"/><text x="440" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">INSERT WebhookEvent — unique violation</text><path d="M 540 586 L 340 586" fill="none" stroke="#9c3d2e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="400.4" y="570" width="79.19999999999999" height="15" fill="#ffffff"/><text x="440" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">already seen</text><path d="M NaN 622 h 106 v 26 h -106" fill="none" stroke="#9c3d2e" stroke-width="1.3" marker-end="url(#a3)"/><rect x="NaN" y="628" width="257.5" height="15" fill="#ffffff"/><text x="NaN" y="640" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9c3d2e" text-anchor="start">no transition, no ledger entry — 200, no work</text><path d="M 340 674 L 140 674" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="180.8" y="658" width="118.39999999999999" height="15" fill="#ffffff"/><text x="240" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">200 OK (idempotent)</text><path d="M 740 718 L 540 718" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="538.8" y="702" width="202.39999999999998" height="15" fill="#ffffff"/><text x="640" y="710" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">worker later claims the outbox row</text><rect x="60" y="754" width="760" height="62" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="774" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: repeated delivery produces one state transition and one ledger transaction. The provider event id, not the</text><text x="75" y="791" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">payload, is the key.</text></svg>