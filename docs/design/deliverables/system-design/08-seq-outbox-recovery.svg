<svg xmlns="http://www.w3.org/2000/svg" width="880" height="738" viewBox="0 0 880 738"><rect width="880" height="738" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — outbox recovery after a crash</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">INV-10: a committed event is processed exactly once after recovery (phase 10)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">API</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">business tx</text><path d="M 140 162 V 708" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">outbox table</text><path d="M 340 162 V 708" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Worker</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">BullMQ</text><path d="M 540 162 V 708" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="660" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="740" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Provider</text><text x="740" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">external effect</text><path d="M 740 162 V 708" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 340 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="63.20000000000002" y="174" width="353.59999999999997" height="15" fill="#ffffff"/><text x="240" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">BEGIN · business state + OutboxEvent(status=pending) · COMMIT</text><path d="M 540 234 L 340 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="322" y="218" width="236" height="15" fill="#ffffff"/><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">claim pending rows  (SKIP LOCKED, lease)</text><path d="M 340 278 L 540 278" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="403.2" y="262" width="73.6" height="15" fill="#ffffff"/><text x="440" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">row claimed</text><path d="M 540 322 L 740 322" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="569.6" y="306" width="140.79999999999998" height="15" fill="#ffffff"/><text x="640" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">perform the side effect</text><path d="M NaN 358 h 106 v 26 h -106" fill="none" stroke="#9c3d2e" stroke-width="1.3" marker-end="url(#a3)"/><rect x="NaN" y="364" width="235.5" height="15" fill="#ffffff"/><text x="NaN" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9c3d2e" text-anchor="start">✗ process killed before marking processed</text><path d="M NaN 402 h 106 v 26 h -106" fill="none" stroke="#2f4470" stroke-width="1.3" marker-end="url(#a2)"/><rect x="NaN" y="408" width="246.5" height="15" fill="#ffffff"/><text x="NaN" y="420" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2f4470" text-anchor="start">lease expires — row becomes claimable again</text><path d="M 540 454 L 340 454" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="380.8" y="438" width="118.39999999999999" height="15" fill="#ffffff"/><text x="440" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">claim again (retry)</text><path d="M 540 498 L 740 498" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="485.6" y="482" width="308.79999999999995" height="15" fill="#ffffff"/><text x="640" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">side effect — must be idempotent (same operation key)</text><path d="M 540 542 L 340 542" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="364" y="526" width="152" height="15" fill="#ffffff"/><text x="440" y="534" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">UPDATE status = processed</text><path d="M 340 586 L 540 586" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="408.8" y="570" width="62.4" height="15" fill="#ffffff"/><text x="440" y="578" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">processed</text><rect x="60" y="622" width="760" height="62" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="642" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: killed between commit and publication, the event is still processed exactly once after recovery. Publication</text><text x="75" y="659" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">may repeat; the consumer is idempotent regardless (architecture rule 6).</text></svg>