<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" viewBox="0 0 880 650"><rect width="880" height="650" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23201a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4470"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d2e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59554c"/></marker></defs><text x="44" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#23201a" text-anchor="start">Sequence — two workers race one payout</text><text x="44" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59554c" text-anchor="start">INV-8: a payout is executed at most once (phase 11)</text><rect x="60" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="140" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Worker A</text><text x="140" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">payout processor</text><path d="M 140 162 V 620" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="260" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="340" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Worker B</text><text x="340" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">payout processor</text><path d="M 340 162 V 620" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="460" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="540" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Database</text><text x="540" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">Payout row</text><path d="M 540 162 V 620" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="660" y="118" width="160" height="44" rx="7" fill="#fffdf9" stroke="#1c2a45" stroke-width="1.3"/><text x="740" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#23201a" text-anchor="middle">Provider</text><text x="740" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#59554c" text-anchor="middle">transfer</text><path d="M 740 162 V 620" stroke="#d5d2ca" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M 140 190 L 540 190" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="219.2" y="174" width="241.6" height="15" fill="#ffffff"/><text x="340" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">claim payout P — WHERE status = requested</text><path d="M 340 234 L 540 234" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="282.8" y="218" width="314.4" height="15" fill="#ffffff"/><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">claim payout P — WHERE status = requested (concurrent)</text><path d="M 540 278 L 140 278" fill="none" stroke="#2f6b4f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="208" y="262" width="264" height="15" fill="#ffffff"/><text x="340" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#2f6b4f" text-anchor="middle">updateMany count = 1 · Requested → Processing</text><path d="M 540 322 L 340 322" fill="none" stroke="#9c3d2e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="364" y="306" width="152" height="15" fill="#ffffff"/><text x="440" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#9c3d2e" text-anchor="middle">count = 0 — lost the race</text><path d="M NaN 358 h 106 v 26 h -106" fill="none" stroke="#9c3d2e" stroke-width="1.3" marker-end="url(#a3)"/><rect x="NaN" y="364" width="136.5" height="15" fill="#ffffff"/><text x="NaN" y="376" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9c3d2e" text-anchor="start">stop — no provider call</text><path d="M 140 410 L 740 410" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="352.8" y="394" width="174.39999999999998" height="15" fill="#ffffff"/><text x="440" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">exactly one provider transfer</text><path d="M 740 454 L 140 454" fill="none" stroke="#23201a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)" opacity="0.8"/><rect x="403.2" y="438" width="73.6" height="15" fill="#ffffff"/><text x="440" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">transfer id</text><path d="M 140 498 L 540 498" fill="none" stroke="#23201a" stroke-width="1.4" marker-end="url(#ar)" opacity="0.8"/><rect x="286.4" y="482" width="107.19999999999999" height="15" fill="#ffffff"/><text x="340" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#23201a" text-anchor="middle">Processing → Paid</text><rect x="60" y="534" width="760" height="62" rx="6" fill="#e6f4ea" stroke="#2f6b4f" opacity="0.9"/><text x="75" y="554" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">Observable: under concurrent claims, exactly one provider transfer is initiated per payout. The state predicate — not the</text><text x="75" y="571" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="start">worker — is the guard.</text></svg>