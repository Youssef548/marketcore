<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarketCore — user flows, shipped and planned</title>
<style>
  :root{
    --paper:#f6f4ef;
    --panel:#ffffff;
    --ink:#1b1a18;
    --muted:#6d6a63;
    --faint:#9a968d;
    --line:#e4dfd6;
    --line-strong:#cfc8bb;
    --proven:#0e6b5c;
    --next:#9a5b06;
    --gap:#9a2b1e;
    --proven-bg:#e7f1ee;
    --next-bg:#f6ecda;
    --gap-bg:#f6e4e1;
    --accent:#1b1a18;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
  a{color:inherit}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:#efece5;padding:1px 5px;border-radius:2px}

  .wrap{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}}

  /* ---------- sidebar ---------- */
  .nav{border-right:1px solid var(--line);padding:28px 22px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
  @media (max-width:860px){.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
  .brand{font-family:Georgia,serif;font-size:19px;letter-spacing:-.02em}
  .brand small{display:block;font-family:inherit;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
  .nav h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px;font-weight:600}
  .navbtn{
    display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
    padding:9px 10px;cursor:pointer;color:var(--muted);font:inherit;font-size:13.5px;line-height:1.35;
  }
  .navbtn:hover{color:var(--ink);background:#efece5}
  .navbtn[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);background:#efece5;font-weight:600}
  .navbtn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
  .dot.shipped{background:var(--proven)}
  .dot.wip{background:var(--next)}
  .dot.planned{background:var(--faint)}

  .legend{font-size:12.5px;color:var(--muted);line-height:1.9}
  .role{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line-strong);border-radius:2px;background:#fff}
  .role.buyer{border-color:#b9c6d6;background:#eef3f8}
  .role.seller{border-color:#cbbfa4;background:#f6f1e6}
  .role.web{border-color:#c9c2d8;background:#f1eef7}
  .role.api{border-color:#a9cfc6;background:#e6f1ee}
  .role.db{border-color:#c6cdb2;background:#eef1e6}
  .role.worker{border-color:#d8c3a8;background:#f7eee3}
  .role.provider{border-color:#d6b0b0;background:#f7eaea}
  .role.alt{border-color:#d3b3b0;background:#f7eae9}

  .alts{margin-top:12px;display:grid;gap:6px}
  .alts .alt{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .alts .alt .when{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);min-width:0}
  .alts .alt .tx{color:var(--ink)}

  /* ---------- main ---------- */
  main{padding:38px 44px 90px;max-width:1180px}
  @media (max-width:860px){main{padding:26px 18px 70px}}
  .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .title{font-size:30px;margin:8px 0 10px}
  .lede{color:var(--muted);max-width:70ch;margin:0 0 26px}

  .roadmap{display:flex;gap:0;border:1px solid var(--line);background:var(--panel);margin:0 0 34px;flex-wrap:wrap}
  .seg{flex:1 1 150px;padding:12px 14px;border-right:1px solid var(--line)}
  .seg:last-child{border-right:0}
  .seg b{display:block;font-size:12.5px}
  .seg span{font-size:11.5px;color:var(--muted)}
  .seg .bar{height:4px;margin-top:9px;background:var(--line)}
  .seg .bar i{display:block;height:100%}
  .bar .done{background:var(--proven)}
  .bar .doing{background:var(--next)}

  .flow{border:1px solid var(--line);background:var(--panel);margin:0 0 22px}
  .flow > header{padding:15px 18px 13px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .flow h3{font-size:16.5px}
  .flow .who{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .flow .body{padding:16px 18px}

  .rail{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
  .step{
    border:1px solid var(--line-strong);background:#fdfcf9;padding:9px 11px;cursor:pointer;
    min-width:132px;max-width:200px;transition:background .12s,border-color .12s;
  }
  .step:hover{background:#f4f1ea}
  .step[aria-pressed="true"]{border-color:var(--accent);background:#efece5;box-shadow:inset 0 0 0 1px var(--accent)}
  .step .rl{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .step .tx{font-size:13px;line-height:1.35}
  .arrow{display:flex;align-items:center;color:var(--line-strong);padding:0 8px;font-size:15px;user-select:none}
  @media (max-width:520px){.arrow{transform:rotate(90deg);padding:4px 0}}

  .detail{margin-top:14px;border-left:3px solid var(--accent);background:#f4f1ea;padding:11px 14px;font-size:13.5px;min-height:22px;color:var(--muted)}
  .detail b{color:var(--ink)}

  .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line-strong);font-size:12.5px}
  .meta div{color:var(--muted)}
  .meta b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;font-weight:600}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;margin:0 4px 4px 0}
  .pill.proven{background:var(--proven-bg);color:var(--proven)}
  .pill.next{background:var(--next-bg);color:var(--next)}
  .pill.gap{background:var(--gap-bg);color:var(--gap)}
  .pill.rel{background:#efece5;color:var(--ink);border:1px solid var(--line-strong)}
  .flow h3 .no{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;color:var(--faint);margin-right:8px;letter-spacing:0}

  .note{margin-top:16px;border:1px dashed var(--line-strong);background:#fbfaf7;padding:12px 15px;font-size:13px;color:var(--muted)}
  .note b{color:var(--ink)}
  footer.page{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
</div>

<script>
const ROLES = {
  buyer:    "Buyer",
  seller:   "Seller / org member",
  web:      "Web app (BFF)",
  api:      "API",
  db:       "Database",
  worker:   "Worker",
  provider: "Payment provider",
  alt:      "Alternate outcome"
};

const PHASES = [
  {
    id: "now",
    dot: "shipped",
    nav: "Live today",
    navsub: "Phases 0–3 + web slice",
    kicker: "Shipped",
    title: "What a user can already do",
    lede: "Identity, tenancy and catalog are built, and the operator web app signs a user in, holds the session in httpOnly cookies and selects an organization. Everything below is exercised by unit, e2e, integration or behavioural tests.",
    flows: [
      {
        no: "01-02",
        title: "Create an account",
        who: ["buyer", "seller"],
        steps: [
          { role:"web",   label:"Open /register" },
          { role:"web",   label:"Submit email + password" },
          { role:"api",   label:"Check password policy (12+ code points)" },
          { role:"api",   label:"Refuse duplicate email → 409" },
          { role:"api",   label:"Hash with argon2id, create User" },
          { role:"web",   label:"Redirect → /login?registered=1" }
        ],
        detail: ["Registration creates the <b>user only</b> — a session is a separate concern. A rejected password never reaches the hasher, so a hostile request cannot spend CPU on argon2 before being refused.", "Refused login and wrong password answer <b>identically</b>, so the endpoint is not an account-enumeration oracle."],
        proves: ["proven"],
        invariant: "Identity foundation",
        gate: "pnpm --filter api test:e2e"
      },
      {
        no: "01-03",
        title: "Sign in and hold a session",
        who: ["buyer","seller"],
        steps: [
          { role:"web",   label:"Open /login, submit credentials" },
          { role:"web",   label:"BFF POST /api/auth/login" },
          { role:"api",   label:"Verify argon2 hash" },
          { role:"api",   label:"Issue access + refresh, open Session row" },
          { role:"web",   label:"Set httpOnly cookies (mc_at, mc_rt)" },
          { role:"web",   label:"Redirect /dashboard → pick organization" }
        ],
        detail: ["The browser never holds a credential a script can read: both tokens live in <b>httpOnly</b> cookies and only the BFF's route handlers call the API (ADR 011).", "A wrong password returns the same <code>401</code> as an unknown email, by design."],
        proves:["proven"],
        invariant:"Session established",
        gate:"pnpm --filter e2e test:behavioural"
      },
      {
        no: "01-04",
        title: "Stay signed in across a stale access token",
        who: ["buyer","seller"],
        steps: [
          { role:"web",   label:"Any request with an expired access token" },
          { role:"web",   label:"Single-flight refresh (one rotation)" },
          { role:"api",   label:"Rotate refresh token; revoke on replay" },
          { role:"web",   label:"Store replacement cookies, retry once" }
        ],
        detail: ["Naive concurrency <i>is</i> a replay, and a replay kills the whole session — so rotation is single-flight with one step of memory for the request that left before the rotation settled.", "Measured: six concurrent session loads produce <b>exactly one</b> <code>/auth/refresh</code>."],
        proves:["proven"],
        invariant:"Refresh rotation / reuse detection",
        gate:"pnpm --filter web test"
      },
      {
        no: "01-05",
        title: "Act inside one organization (tenant)",
        who: ["seller","api"],
        steps: [
          { role:"web",   label:"Choose organization in the rail" },
          { role:"web",   label:"Attach x-organization-id header" },
          { role:"api",   label:"TenantGuard resolves membership → TenantContext" },
          { role:"db",    label:"Queries scoped to the organization" },
          { role:"api",   label:"Cross-tenant → 404 (or 403 for a wrong header)" }
        ],
        detail: ["Tenant identity travels in a header resolved by a guard, never read by a controller. A cross-tenant read answers <b>404</b>; a header naming someone else's tenant answers <b>403</b>.","This is the project's flagship proven invariant."],
        proves:["proven"],
        invariant:"INV-9 — tenant isolation",
        gate:"pnpm --filter api test:e2e"
      },
      {
        no: "01-06",
        title: "Manage a product (seller)",
        who: ["seller"],
        steps: [
          { role:"api",   label:"Create product → DRAFT" },
          { role:"api",   label:"Publish (price ≥ 1) / unpublish" },
          { role:"db",    label:"Inventory row; CHECK available ≥ 0" },
          { role:"api",   label:"Read inventory" }
        ],
        detail: ["Publish/unpublish are explicit guarded transitions, and the non-negative quantity is enforced by a database <code>CHECK</code> rather than by application validation — a test writes around the app to prove it."],
        proves:["proven","gap"],
        gap: "No products page in the UI yet — the catalog is API-only.",
        invariant:"INV-1 (constraint half)",
        gate:"pnpm --filter api test:integration"
      },
      {
        no: "01-07",
        title: "Sign out",
        who: ["buyer","seller"],
        steps: [
          { role:"web",   label:"POST /api/auth/logout" },
          { role:"api",   label:"Revoke session (reason LOGOUT)" },
          { role:"web",   label:"Clear cookies → /login?next=…" }
        ],
        detail: ["Revocation covers sessions and refresh tokens. A stolen access token remains valid until it expires — inherent to a stateless token, which is why its TTL is short."],
        proves:["proven"],
        invariant:"Session revoked",
        gate:"pnpm --filter e2e test:behavioural"
      }
    ]
  },

  {
    id: "p4",
    dot: "wip",
    nav: "Phase 4 · Release 1",
    navsub: "Cart + all-or-nothing checkout",
    kicker: "Next up — Release 1",
    title: "One cart across sellers, one all-or-nothing checkout",
    lede: "The headline claim, now through a buyer's cart: 100 buyers holding the last unit produce exactly one checkout and stock 0. A checkout spans sellers — one order per seller, all created or none — and nothing is reserved at add-to-cart, so the race stays at checkout. The worker arrives here as a plain interval process to cancel unpaid checkouts.",
    flows: [
      {
        no: "02-01",
        rel: "Release 1",
        title: "Buy across two sellers",
        who: ["buyer","web","api","db"],
        steps: [
          { role:"buyer", label:"Browse every seller’s published products" },
          { role:"api",   label:"Add to cart — seller A, then seller B (stock unchanged, no hold)" },
          { role:"web",   label:"Cart grouped by seller, live availability (≤ 10 per line)" },
          { role:"web",   label:"Review step — every price and stock change" },
          { role:"buyer", label:"Confirm the changes once, one currency" },
          { role:"api",   label:"Place order (Idempotency-Key scoped to the buyer)" },
          { role:"db",    label:"One transaction: 1 Checkout + 2 Orders" },
          { role:"web",   label:"Order placed — Pending payment" }
        ],
        detail: [
          "A buyer is a user with no organization membership. They see every organization’s <b>published</b> products, stock count included (D53, D61); drafts, orders, members and the ledger stay private (INV-9, narrowed).",
          "The cart lives on the server, one per buyer, and records <b>intent only</b>. Adding a line does not touch inventory — reserving at add-to-cart was rejected because it moved the race and let one account hold every unit (D55, D58).",
          "Lines are grouped by seller with live availability (“Only N left”, “Sold out”) and capped at 10 units (D59, D72). A buyer reads only their own cart (INV-12).",
          "One review step lists every price change and stock problem since the line was added, so the buyer confirms once instead of being surprised at the end (D60).",
          "The buyer confirms once. A cart that mixes currencies is refused here — one currency per checkout (D71).",
          "Buying requires an account; there is no guest checkout (D54). The key is scoped to the buyer, not an organization, because this checkout spans organizations (INV-2, rescoped).",
          "One <code>Checkout</code> groups the seller orders and will own the payment. Every seller’s order is created or none is (INV-11, D56–D57).",
          "Phase 4 ships checkout as “Place order”: the orders are created <b>Pending payment</b> and the payment step arrives in phases 6–7 (D62)."
        ],
        alts: [
          { role:"alt", when:"Changes not confirmed or mixed currency", label:"Place order stays disabled" }
        ],
        proves:["next"],
        invariant:"INV-11 — every seller’s order or none · INV-12 — own cart only",
        decisions:"D53–D62, D71, D72",
        gate:"pnpm --filter api test:e2e",
        models:"Cart, CartItem, Checkout, Order (+ checkoutId)"
      },
      {
        no: "02-02",
        rel: "Release 1",
        title: "Checkout — 100 buyers, 1 unit",
        who: ["buyer","api","db"],
        steps: [
          { role:"buyer", label:"Place order — the last unit sits in 100 carts" },
          { role:"api",   label:"BEGIN transaction" },
          { role:"db",    label:"Lock every line’s inventory row — FOR UPDATE, in product-id order" },
          { role:"api",   label:"Every line available ≥ quantity?" },
          { role:"db",    label:"Decrement every line, bump version" },
          { role:"db",    label:"Insert Checkout + one Order per seller" },
          { role:"db",    label:"Write OutboxEvent" },
          { role:"api",   label:"COMMIT — exactly 1 checkout wins" }
        ],
        detail: [
          "Every buyer places the order from their cart. Nothing was reserved when they added it, so all 100 carts can hold the same last unit — the contest happens here, once (D58).",
          "Lock, check, decrement and insert commit together, or not at all.",
          "Postgres runs at READ COMMITTED, so the row lock — not the transaction alone — makes exactly one writer win. A multi-seller cart locks several rows, so they are always locked in <b>product-id order</b>: two overlapping carts cannot deadlock (RISK-003).",
          "<b>All or nothing</b>: one short line fails the whole checkout. There is no partial order for the lines that did fit (INV-11, D57).",
          "The decrement can never take available below 0 — the database <code>CHECK</code> backs the lock (INV-1).",
          "Prices are snapped onto the order items. Each order keeps one seller’s <code>organizationId</code> and gains the <code>checkoutId</code>.",
          "The outbox write joins the same transaction, so a committed checkout can never lose its event.",
          "One checkout commits; the other 99 roll back with a 409 and nothing created. Stock ends at 0."
        ],
        alts: [
          { role:"alt", when:"Any line short", label:"Rollback → 409, nothing created — the other 99, and one short line fails all" }
        ],
        proves:["next"],
        invariant:"INV-1 — never negative · INV-11 — all or nothing",
        decisions:"D57, D58",
        gate:"pnpm --filter api test:concurrency",
        models:"Checkout, Order, OrderItem, OutboxEvent",
        risks:["Losing the lock would let two checkouts both decrement from 1. Locking rows in any order but product id can deadlock overlapping carts."]
      },
      {
        no: "02-03",
        rel: "Release 1",
        title: "Lose the last unit",
        who: ["buyer","web","api","db"],
        steps: [
          { role:"buyer", label:"Two buyers hold the last unit in their carts" },
          { role:"api",   label:"Both place order" },
          { role:"db",    label:"Row lock — the second waits" },
          { role:"api",   label:"Unit still available?" },
          { role:"api",   label:"First buyer: COMMIT — checkout + order" },
          { role:"web",   label:"Second buyer: back to the cart — line flagged Sold out" }
        ],
        detail: [
          "Both carts showed the unit as available — the cart is intent, not a hold (D58).",
          "Both requests start a checkout transaction at the same moment.",
          "The second transaction blocks on the inventory row until the first commits or rolls back.",
          "When the lock is released the second sees available 0 and fails its check.",
          "The winner gets a checkout and an order, Pending payment.",
          "The loser’s transaction rolls back: <b>0 orders, 0 stock change, not charged</b> — no payment exists yet. The buyer is returned to the cart with the failing line flagged “Sold out” (D59)."
        ],
        alts: [
          { role:"alt", when:"Second buyer", label:"Rollback — 0 orders · 0 stock change · not charged" }
        ],
        proves:["next"],
        invariant:"INV-1, INV-11 — the loser is charged nothing",
        decisions:"D59",
        gate:"pnpm --filter e2e test:behavioural",
        models:"Cart, CartItem"
      },
      {
        no: "02-04",
        rel: "Release 1",
        title: "Abandoned checkout auto-cancelled",
        who: ["worker","db"],
        steps: [
          { role:"worker", label:"Interval tick — checkouts unpaid 30 min" },
          { role:"db",     label:"UPDATE checkout → Cancelled WHERE status = Pending payment" },
          { role:"worker", label:"Row count = 1?" },
          { role:"db",     label:"Orders → Cancelled, restore stock (same transaction)" },
          { role:"worker", label:"Stock restored exactly once" }
        ],
        detail: [
          "A checkout still unpaid 30 minutes after placement is cancelled. The worker moves forward to phase 4 as a <b>plain interval process</b> — no Redis, no queue (D70, ADR 0001 amended).",
          "Exactly-once comes from a <b>conditional update</b> on the checkout’s status, not from the worker’s memory or a lock service.",
          "Only the run whose update changed a row goes on to restock.",
          "Its orders move Pending payment → Cancelled and every line’s stock is restored in the same transaction as the status change.",
          "Two overlapping runs, or a run racing a late payment, restock at most once (INV-15). Phase 10 adds queues to this same process."
        ],
        alts: [
          { role:"alt", when:"Row count 0", label:"Another run won — no restock" }
        ],
        proves:["next"],
        invariant:"INV-15 — stock restored exactly once",
        decisions:"D70",
        gate:"pnpm --filter worker test:integration",
        models:"Checkout, Order (+ Cancelled), Inventory"
      }
    ]
  },

  {
    id: "p5",
    dot: "planned",
    nav: "Phases 5–6 · Release 1",
    navsub: "Idempotency + payments",
    kicker: "Planned — Release 1",
    title: "Retry-safe checkout and the payment simulator",
    lede: "A buyer who retries must not create a second checkout, and a checkout must be paid at most once — one charge for every seller’s order, decided behind a provider port so a deterministic simulator stands in for Stripe.",
    flows: [
      {
        no: "03-01",
        rel: "Release 1",
        title: "Retry the same checkout",
        who: ["buyer","api","db"],
        steps: [
          { role:"buyer", label:"Place order from the cart, 20 times, one Idempotency-Key" },
          { role:"api",   label:"Look up (buyerId, key)" },
          { role:"api",   label:"Key seen before?" },
          { role:"api",   label:"First call: run checkout once" },
          { role:"db",    label:"Store status + response" },
          { role:"api",   label:"Replays: return the stored response" }
        ],
        detail: [
          "A double click or a network retry sends the same key many times.",
          "The key is scoped to the <b>buyer</b>, not an organization: a checkout spans sellers, so <code>(organizationId, key)</code> cannot identify it (INV-2, rescoped by CR-001).",
          "One key creates at most one logical operation.",
          "The first call runs the checkout: one Checkout, one order per seller.",
          "The stored response is what later calls return.",
          "A replay returns the same body rather than a fresh attempt — replays are no-ops."
        ],
        proves:["next"],
        invariant:"INV-2 — at most one checkout per (buyer, key)",
        decisions:"CR-001 impact: INV-2",
        gate:"pnpm --filter api test:e2e",
        models:"IdempotencyKey"
      },
      {
        no: "03-02",
        rel: "Release 1",
        title: "Pay for a checkout",
        who: ["api","provider","db"],
        steps: [
          { role:"api",      label:"Payment created for the checkout (Pending)" },
          { role:"provider", label:"Attempt capture (simulator or Stripe test)" },
          { role:"api",      label:"Capture succeeded?" },
          { role:"db",       label:"Succeeded + PaymentAttempt — every order of the checkout → Paid" }
        ],
        detail: [
          "<b>One buyer charge per checkout</b>, not per order: <code>Payment.orderId</code> becomes <code>Payment.checkoutId</code> (D63).",
          "Behind the provider port a deterministic simulator stands in for Stripe test mode.",
          "Illegal transitions are rejected at the domain boundary: a failed payment cannot become succeeded without a new attempt, and a succeeded payment cannot be captured twice.",
          "A checkout is paid at most once (INV-3, rescoped from the order), and every seller’s order moves to Paid together. Each seller’s share is credited by the ledger and moved later by a payout (separate charges and transfers, ADR 014)."
        ],
        alts: [
          { role:"alt", when:"Capture failed", label:"Failed — needs a new attempt" }
        ],
        proves:["next"],
        invariant:"INV-3 — a checkout paid at most once",
        decisions:"D62, D63",
        gate:"pnpm --filter api test:e2e",
        models:"Payment (checkoutId), PaymentAttempt"
      }
    ]
  },

  {
    id: "p7",
    dot: "planned",
    nav: "Phases 7–9 · Release 1",
    navsub: "Stripe, split ledger, refunds",
    kicker: "Planned — Release 1",
    title: "Webhooks, the split double-entry ledger and buyer refunds",
    lede: "Money becomes auditable: every financial event writes a balanced ledger transaction, one capture is split into each seller’s payable and the platform’s revenue, a duplicated webhook causes each side effect once, and a refund can never exceed what was captured.",
    flows: [
      {
        no: "04-01",
        rel: "Release 1",
        title: "Payment webhook",
        who: ["provider","api","db"],
        steps: [

          { role:"api",      label:"(provider, eventId) seen?" },

          { role:"db",       label:"Write ledger transaction" }

        detail: [

          "Deduplication is keyed on the provider’s own event id in a unique <code>WebhookEvent</code> row, so a repeated delivery is a no-op rather than a double charge.",
          "One payment covers the checkout, so a single event moves <b>every seller’s order</b> of that checkout — never one order on its own.",
          "The ledger transaction is written in the same unit of work as the transition."
        ],
        alts: [
          { role:"alt", when:"Duplicate delivery", label:"200 — no work" }
        ],
        proves:["next"],
        invariant:"INV-4 — each side effect at most once",
        decisions:"D63",
        gate:"pnpm --filter api test:e2e",
        models:"WebhookEvent"
      },
      {
        no: "04-02",
        rel: "Release 1",
        title: "Capture posts to the ledger",
        who: ["api","db"],
        steps: [
          { role:"api", label:"Capture 150: seller A 100, seller B 50, fee 10%" },
          { role:"db",  label:"Debit platform cash 150" },
          { role:"db",  label:"Credit seller A payable 90" },
          { role:"db",  label:"Credit seller B payable 45" },
          { role:"db",  label:"Credit platform revenue 15" },
          { role:"db",  label:"Signed entries sum to 0, per currency" }
        ],
        detail: [
          "One charge for a two-seller checkout. Amounts are integer minor units; <code>signedAmountMinor</code> is a BigInt with a wire string codec.",
          "The platform holds the whole capture first — separate charges and transfers (D63, ADR 014).",
          "Seller A’s share: 100 less the 10% fee.",
          "Seller B’s share: 50 less the 10% fee.",
          "The fee is the platform’s revenue. The seller shares plus the fee equal the capture (INV-13).",
          "Entries are append-only: <code>LedgerEntry</code> has no update or delete path, so INV-7 is enforced by the schema offering no way to violate it. Payouts later move each seller’s payable."
        ],
        proves:["next"],
        invariant:"INV-6 balances · INV-7 append-only · INV-13 seller shares + fee = capture",
        decisions:"D63",
        gate:"pnpm --filter api test:integration",
        models:"LedgerAccount, LedgerTransaction, LedgerEntry"
      },
      {
        no: "04-03",

        title: "Buyer requests a refund, seller approves",

          { role:"api",      label:"Own order, Paid or later?" },
          { role:"db",       label:"Refund Requested — on that seller’s Refunds screen" },
          { role:"seller",   label:"Seller approves?" },
          { role:"api",      label:"≤ order total and ≤ captured?" },
          { role:"provider", label:"Provider refund on the checkout payment" },
          { role:"db",       label:"Reversing ledger transaction — that seller’s share only" },
          { role:"buyer",    label:"Buyer sees the refund status" }
        ],
        detail: [
          "The buyer asks from their own order list (D64). A buyer reads only their own orders (INV-12).",
          "An order still Pending payment, or someone else’s, is refused before anything is recorded.",
          "The request is a <code>Refund</code> in a new <b>Requested</b> state, raised by the buyer and shown on the seller’s existing Refunds screen.",
          "The seller decides; a rejection is a new <b>Rejected</b> state the buyer sees. A seller refunds only their own order.",
          "Cumulative refunds never exceed the order total or the capture, checked in the transaction (INV-5).",
          "The refund is issued against the one checkout payment, for this order’s amount.",
          "Corrections are compensating entries, never edits: only this seller’s payable is reversed.",
          "The buyer sees Requested, Rejected, or the refund’s outcome."
        ],
        alts: [
          { role:"alt", when:"Not eligible", label:"Refused — e.g. still Pending payment" },
          { role:"alt", when:"Seller says no", label:"Rejected — shown to the buyer" },
          { role:"alt", when:"Over the cap", label:"Reject — over cap" }
        ],
        proves:["next"],
        invariant:"INV-5 — refunds ≤ captures · INV-12 — own orders only",
        decisions:"D64",
        gate:"pnpm --filter api test:e2e",
        models:"Refund (+ Requested by buyer, Rejected)"
      }
    ]
  },

  {
    id: "p10",
    dot: "planned",
    nav: "Phases 10–11",
    navsub: "Outbox, queues, payouts, audit",
    kicker: "Planned",
    title: "Asynchronous work that survives a crash",
    lede: "The worker already runs from phase 4; here it gains the outbox and queues. Work is claimed from the database, retried, and processed exactly once even if a process is killed between commit and publication. Release 1 closes with this phase.",
    flows: [
      {
        no: "05-01",
        title: "Outbox event processed",
        who: ["api","worker","db"],
        steps: [
          { role:"api",    label:"Commit business state + OutboxEvent (one tx)" },
          { role:"worker", label:"Claim pending rows (skip locked)" },
          { role:"worker", label:"Perform side effect" },
          { role:"worker", label:"Worker crashed mid-flight?" },
          { role:"db",     label:"Mark processed — exactly once" }
        ],
        detail: ["Killed between commit and publication, the event is still recovered and processed <b>exactly once</b> — the claim predicate, not the worker’s memory, is the guard. A crashed claim leaves the row claimable, so it is retried."],
        alts: [
          { role:"alt", when:"Crashed", label:"Row stays claimable → retried" }
        ],
        proves:["next"],
        invariant:"INV-10 — recoverable after a crash",
        gate:"pnpm --filter worker test:e2e",
        models:"OutboxEvent (+ queues added to the phase-4 worker)"
      },
      {
        no: "05-02",
        title: "Two workers race one payout",
        who: ["worker","db","provider"],
        steps: [
          { role:"worker",   label:"Both workers claim the same Payout" },
          { role:"db",       label:"State predicate won?" },
          { role:"provider", label:"Exactly one provider transfer" }
        ],
        detail: ["The payout operation is idempotent at the boundary: a duplicate claim is refused before any money moves. A payout moves one seller’s payable from the split ledger."],
        alts: [
          { role:"alt", when:"Lost the predicate", label:"Loser stops — no money moves" }
        ],
        proves:["next"],
        invariant:"INV-8 — payout executed at most once",
        gate:"pnpm --filter worker test:e2e",
        models:"Payout"
      },
      {
        no: "05-03",
        title: "Audit a mutation",
        who: ["api","db"],
        steps: [
          { role:"api", label:"Mutation performed" },
          { role:"db",  label:"Append AuditLog (actor, org, action, before/after)" },
          { role:"api", label:"Carry requestId — joins the log line" }
        ],
        detail: ["The request id finally reaches the domain layer here, joining an audit record to the log line for the same request."],
        proves:["next"],
        invariant:"Auditability",
        gate:"pnpm --filter api test:e2e",
        models:"AuditLog"
      }
    ]
  },

  {
    id: "r2",
    dot: "planned",
    nav: "Release 2 · after phase 11",
    navsub: "Delivery, reviews, discovery",
    kicker: "Planned — Release 2",
    title: "The rest of the storefront",
    lede: "Release 2 is committed scope that cannot start before phase 11 closes, and cannot delay the invariant phases: addresses and delivery, account and saved payments, reviews, wishlist, discovery (home, category, search, seller store, mobile) and seller-funded promotions (D68). One journey is drawn; the rest are screens rather than new correctness claims.",
    flows: [
      {
        no: "06-01",
        rel: "Release 2",
        title: "Deliver and review",
        who: ["buyer","seller","api","db"],
        steps: [
          { role:"buyer",  label:"Checkout with a saved address (snapshotted onto the order)" },
          { role:"seller", label:"Fulfil: Paid → Fulfilling → Completed" },
          { role:"buyer",  label:"Write a review" },
          { role:"api",    label:"Completed order with it, no review yet?" },
          { role:"db",     label:"Review stored — unique (product, buyer)" },
          { role:"seller", label:"Seller may reply, never delete" }
        ],
        detail: [
          "The address is copied onto the order at checkout, so editing a saved address never rewrites where a past order went.",
          "The seller moves their own order through fulfilment to Completed.",
          "Only a verified buyer reviews (D65).",
          "Eligibility: an order containing the product is Completed, and this buyer has not reviewed it yet.",
          "One review per buyer per product, enforced by a unique constraint rather than a check in code.",
          "A seller may answer a review but can never remove it."
        ],
        alts: [
          { role:"alt", when:"Not eligible", label:"Refused — not a verified buyer" }
        ],
        proves:["next"],
        invariant:"One review per (product, buyer), verified buyers only",
        decisions:"D65, D68",
        gate:"pnpm --filter api test:e2e",
        models:"Address, Review"
      }

  {
    id: "p12",
    dot: "planned",
    nav: "Phases 12–15",
    navsub: "Telemetry, load, deploy",
    kicker: "Planned",
    title: "Operate it and ship it",
    lede: "No new invariant — this is where the system is measured, deployed and presented, after Release 2. Every claim above gets a number or a URL behind it.",
    flows: [
      {
        no: "07-01",
        title: "Prove it under load and in the cloud",
        who: ["api","worker"],
        steps: [
          { role:"api",    label:"Telemetry / tracing" },

          { role:"api",    label:"Published numbers" },

          { role:"api",    label:"Hardening + portfolio write-up" }
        ],
        detail: ["The repository is engineering evidence: each completed phase closes with a runnable command that proves its exit gate, and the README records what is proven versus planned."],

// ---- render ----
const nav = document.getElementById("nav");
const main = document.getElementById("main");

nav.innerHTML =
  '<div class="brand">MarketCore<small>user flows</small></div>' +
  '<h4>Roadmap</h4>' +
  PHASES.map((p,i) =>
    '<button class="navbtn" data-i="'+i+'" data-id="'+p.id+'">' +
      '<span class="dot '+p.dot+'"></span>'+p.nav+'</button>'
  ).join("") +
  '<h4>Actors</h4><div class="legend">' +
    Object.keys(ROLES).map(r => '<div><span class="role '+r+'">'+ROLES[r]+'</span></div>').join("") +
  '</div>' +
  '<h4>Status</h4><div class="legend">' +
    '<div><span class="dot shipped"></span> Shipped &amp; tested</div>' +
    '<div><span class="dot wip"></span> In progress</div>' +
    '<div><span class="dot planned"></span> Planned</div>' +
  '</div>';

function roleChip(r){ return '<span class="role '+r+'">'+ROLES[r]+'</span>'; }

function renderPhase(i){
  const p = PHASES[i];
  main.innerHTML =
    '<div class="kicker">'+p.kicker+'</div>' +
    '<h1 class="title">'+p.title+'</h1>' +
    '<p class="lede">'+p.lede+'</p>' +
    '<div class="roadmap">'+PHASES.map((q,j)=>{
        const fill = q.dot==="shipped" ? '<i class="done" style="width:100%"></i>'
                   : q.dot==="wip" ? '<i class="doing" style="width:55%"></i>' : '';
        return '<div class="seg"><b style="color:'+(j===i?'var(--ink)':'var(--muted)')+'">'+q.nav+'</b><span>'+q.navsub+'</span><div class="bar">'+fill+'</div></div>';
      }).join("") + '</div>' +
    p.flows.map((f,fi) => {
      const rail = f.steps.map((s,si)=>{
        const arrow = si < f.steps.length-1 ? '<span class="arrow">&#8594;</span>' : '';
        return '<div class="step" role="button" tabindex="0" aria-pressed="false" data-f="'+fi+'" data-s="'+si+'">' +
                 '<span class="rl">'+ROLES[s.role]+'</span><span class="tx">'+s.label+'</span></div>' + arrow;
      }).join("");
      const pills = (f.rel ? '<span class="pill rel">'+f.rel+'</span>' : "") +
        (f.proves||[]).map(x => '<span class="pill '+x+'">'+(x==="proven"?"Proven":x==="gap"?"Gap":"Planned")+'</span>').join("");
      const alts = f.alts ? '<div class="alts">' + f.alts.map(a =>
          '<div class="alt">'+roleChip(a.role)+'<span class="when">'+a.when+'</span><span class="tx">'+a.label+'</span></div>'
        ).join("") + '</div>' : "";
      const meta =
        alts +
        '<div class="meta">' +
          '<div><b>Invariant</b>'+f.invariant+'</div>' +
          (f.decisions ? '<div><b>Decisions</b>'+f.decisions+'</div>' : "") +
          '<div><b>Exit gate</b><code>'+f.gate+'</code></div>' +
          '<div><b>Models</b>'+(f.models||"—")+'</div>' +
        '</div>' +
        (f.risks ? '<div class="note"><b>Watch:</b> '+f.risks.join(" ")+'</div>' : "") +
        (f.gap ? '<div class="note"><b>Gap:</b> '+f.gap+'</div>' : "");
      return '<section class="flow" id="flow-'+(f.no||fi)+'"><header><h3>'+(f.no ? '<span class="no">'+f.no+'</span>' : "")+f.title+'</h3><div class="who">' +
               (f.who||[]).map(roleChip).join("") + pills +
             '</div></header><div class="body">' +
               '<div class="rail">'+rail+'</div>' +
               '<div class="detail" data-detail="'+fi+'">Click a step to see what happens and why it matters.</div>' +
               meta +
             '</div></section>';
    }).join("") +
    '<footer class="page">Hand-authored. Journeys, numbering, steps and outcomes match the generated diagrams in <code>flows/</code> (<code>generators/gen-flows.mjs</code>); storefront scope and the D-numbers come from CR-001 (<code>docs/superpowers/specs/2026-10-16-cr-001-buyer-storefront.md</code>). The project has no fixed dates: work is ordered by phase, and the storefront ships in Release 1 (alongside phases 4–11) and Release 2 (after phase 11). Source of truth: <code>README.md</code> (roadmap), <code>docs/domain-model.md</code> (invariants), <code>docs/superpowers/STATUS.md</code> (evidence).</footer>';

  // wire nav state
  [...nav.querySelectorAll(".navbtn")].forEach(b =>
    b.setAttribute("aria-current", String(Number(b.dataset.i)===i)));

  // wire steps
  main.querySelectorAll(".step").forEach(el => {
    const activate = () => {
      const f = p.flows[Number(el.dataset.f)];
      main.querySelectorAll('.step[data-f="'+el.dataset.f+'"]')
        .forEach(s => s.setAttribute("aria-pressed","false"));
      el.setAttribute("aria-pressed","true");
      const d = main.querySelector('.detail[data-detail="'+el.dataset.f+'"]');
      const txt = f.detail[Number(el.dataset.s)] || f.detail[0];
      d.innerHTML = '<b>'+f.steps[Number(el.dataset.s)].label+'</b> — '+txt;
    };
    el.addEventListener("click", activate);
    el.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); }});
  });
}

nav.addEventListener("click", e => {
  const b = e.target.closest(".navbtn");
  if(b) renderPhase(Number(b.dataset.i));
});

renderPhase(0);
</script>
</body>
</html>
